# 任务类 HTTP/HTTPS 视频：临时下载后本地抽帧，不长期保存原视频。
connect_timeout_s: 10
read_timeout_s: 30
total_timeout_s: 120
max_size_mb: 500
max_redirects: 5
max_attempts: 3
retry_delay_s: 1
stale_after_hours: 24
# 可信用户场景：默认允许所有 HTTP/HTTPS 视频主机，包括内网 OBS，无需白名单。
# 旧 allowed_hosts 和 REMOTE_VIDEO_ALLOWED_HOSTS 已停用；遗留配置会被忽略。
