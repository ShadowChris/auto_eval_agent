name: 任务类专家经验
description: 补充评测模型无法仅从录屏直接获得的设备环境、产品能力、前置条件和界面语义知识。
version: 3
categories:
  - key: device_environment
    name: 评测设备环境
    description: 评测设备的固定环境条件。
    rules:
      - 当前任务类录屏使用的评测手机未安装 SIM 卡；涉及拨打电话、发送短信或使用移动数据时，应将 SIM 卡缺失视为可信设备条件。

  - key: execution_window
    name: 任务执行窗口
    description: 任务执行窗口的展开、缩略和流程状态。
    rules:
      - 正常情况下，任务执行窗口会自动展开并展示详细过程。
      - 出现“正在操作设置”“思考中”“任务执行中”“已结束操控，点击查看”等文字或“查看/点击查看”入口，表示任务窗口仍处于缩略状态；此时后台界面被遮罩或模糊属于正常产品表现。
      - 系统显示“√已完成”只表示本轮任务执行流程结束，不代表用户任务目标已经完成；不得仅凭该标识判为 ok，仍需结合具体结果状态、结果卡片和 agent 回复判断。该标识是系统流程状态，不是 agent 的自然语言回复；不得仅因它与实际任务结果不同而标记回复与界面不一致。
      - 任务执行面板中的步骤文案、勾选标记、“已完成”“超时，任务终止”等均属于系统流程状态，不属于 agent 面向用户的自然语言回复。步骤显示“已完成”只证明该步骤结束，不能证明整个 query 已完成，也不能用于标记回复与界面不一致或回复内容自相矛盾。同一面板另有“当前操作需要你的确认”“请明确告诉我你的选择”等用户操作指引时，应以该指引确定任务正在等待用户；随后出现的超时终止不改变这一根因。

  - key: special_result_semantics
    name: 特殊结果状态
    description: 特定结果卡和生成状态的产品语义。
    rules:
      - 播客内容生成耗时较长；只要出现可识别的播客系统结果卡，即视为播客生成目标完成，即使卡片仍显示“生成中”或尚未自动播放。此时 agent 回复“播客已生成”“已经生成好了”表达的是结果卡已经成功创建，与卡片仍在生成具体音频内容不构成回复与界面不一致。只有泛化的生成中文字而没有播客结果卡时，不能判完成；卡片明确显示生成失败时也不能判完成。
      - Excel 等文档生成任务耗时较长；只要出现与 query 要求的文档类型和内容主题相符、且没有失败状态的可识别文档结果卡，即视为文档生成目标完成，即使卡片内容仍在生成或尚未提供最终预览。只有泛化的“正在生成”文字而没有文档结果卡时不能判完成；卡片类型或主题与 query 不符、或明确显示生成失败时也不能判完成。
      - 手电筒开启后，上方状态区域左侧会显示手电筒图标元素，右侧会显示“已开启”；二者在同一手电筒状态区域共同出现时，可以作为手电筒已经开启的直接结果证据，不要求再展示控制中心开关或操作前后对比。

  - key: recording_interference
    name: 录屏工具与录像证据
    description: 录屏工具产生的干扰信息及录像任务证据。
    rules:
      - 顶部红色录屏计时、录制胶囊、状态图标、触控提示和悬浮控件来自评测录屏工具，不是 agent 操作。
      - 对拍视频或录像任务，顶部状态栏或灵动岛的红点和计时不能证明相机正在录像；应以相机应用内部的停止或暂停按钮、独立录像计时，或者图库中的新视频为准。

  - key: sensitive_operations
    name: 安全认证与敏感操作
    description: 人脸、密码和权限等隐私保护交互。
    rules:
      - 录入人脸或输入密码时，录屏画面可能显示黑屏，这是系统隐私保护机制，不能仅凭黑屏判断任务失败。
      - 黑屏本身不能证明任务完成，仍需结合黑屏前后的界面、最终状态和 Agent 回复判断。

  - key: supported_capabilities
    name: 已确认支持的能力
    description: 评测设备和智能助手已经确认支持的操作能力。
    rules:
      - 支持开启和关闭关怀模式。
      - 当前评测设备存在系统“证书与凭据”页面；“打开证书管理”对应打开该页面。
      - 当前评测设备支持来电播报功能，可选项包括“始终播报”“仅耳机”“耳机与汽车”“不播报”。
      - 支持打开自定义应答语。
      - 支持开启和关闭家人共享。
      - 支持开启和关闭隔空手势截屏。
      - 支持开启和关闭隔空传送。
      - 支持开启和关闭语音通话的闪光设置。

  - key: display_and_font
    name: 显示与字体设置
    description: 系统显示、字体和档位之间的产品规则。
    rules:
      - 字体大小由大到小依次为：特大三档、特大二档、特大一档、特大、超大、大、标准、小。
      - 键盘字体与系统字体属于不同设置项，不能用其中一个状态证明另一个已经设置成功。

  - key: prerequisites
    name: 功能前置条件
    description: 执行特定功能前必须满足的系统条件。
    rules:
      - 获取屏幕使用情况之前，需要在健康使用设备界面完成授权。
      - 屏幕使用时间管理依赖健康使用设备功能已经开启。
      - 设置唤醒灵敏度的前置条件是语音唤醒功能已经开启。
