name: operation
display: 任务类
matching_categories: []
rules: "任务类（录屏）评测：看录屏关键帧判断操作是否完成意图。务必区分「真的执行」与「只给口头指导/教程而未执行」。"
operation_policy:
  prior_knowledge:
    - 当前任务类录屏使用的评测手机未安装 SIM 卡；涉及拨打电话、发送短信或使用移动数据时，应将 SIM 卡缺失视为可信设备条件。
    - 正常情况下，任务执行窗口会自动展开并展示详细过程；出现“正在操作设置”“思考中”“任务执行中”“已结束操控，点击查看”等文字或“查看/点击查看”入口，表示窗口仍处于缩略状态，遮罩或模糊后台界面是正常产品表现。
    - 顶部红色录屏计时、录制胶囊、状态图标、触控提示和悬浮控件来自评测录屏工具，不是 agent 操作。
    - 对拍视频或录像任务，顶部状态栏或灵动岛的红点和计时不能证明相机正在录像；应以相机应用内部的停止或暂停按钮、独立录像计时，或图库中的新视频为准。
  scope_rules:
    - 基于整个 query 评估，不要拆成多个独立 case。
    - 简单任务只有一个可独立验收的最终结果；复杂多任务包含多个可独立验收的结果。判断依据是结果数量，不是点击次数。
    - 同时要求前置判断结果和条件成立后的执行动作时，包含两个可独立验收的结果，按复杂多任务处理。
    - 只评价从当前 query 首次发出或开始执行，到任务闭环、失败或录屏结束之间的行为；忽略此前历史内容和完成后的复制、滚动、返回或新任务，除非它改变或撤销目标状态。
  evidence_rules:
    - 证据是否充分取决于其展示的具体内容，而不是所在载体；卡片、按钮、设置页面、系统状态、任务执行过程和结果页面都可以用于判断。
    - 画面明确展示目标对象及其结果状态，并且与 query 一致、没有相反证据时，即可作为完成依据；例如设置结果卡片直接显示目标开关状态或当前值，无需再次进入完整设置页面。
    - 多条证据可以共同证明同一生效目标；具体执行动作或参数、完成状态、结果卡片和 agent 回复相互一致时，可以形成充分的完成证据链。复杂多任务的每个生效目标都必须有对应证据，一个目标的证据不能替代其他目标。
    - 缺少反证不等于存在完成证据；不得因其他目标执行成功、系统具备操作能力或 agent 声称无报错，就推定未展示结果的目标已经完成。
    - 只有泛化的“正在操作/已完成”、工具名称、目标入口、操作轨迹或 agent 文字自述，而没有反映所有生效目标的具体结果状态时，只能证明尝试；录屏数据完整时判 nok，并标记仅文字声称完成或完成证据不足。
    - 不要求展示状态变化前后对比，最终画面或初始状态直接满足 query 即可；关键帧未展示全部过渡过程不等于步骤错误，只根据实际观察到的走错、遗漏、重复、冗余或结果冲突扣分。
    - 任务执行窗口始终处于带“查看/点击查看”入口的缩略状态，导致过程和结果均不可见，且没有其他证据可供判断时，判 others，优先标记任务执行窗口未展开，相关评分维度填 null；窗口曾展开或其他画面已展示结果时，按正常证据判断。
    - 查询、导航、搜索、日程等结果以文字或卡片呈现时，文字或卡片可以是最终结果，但必须核对实体、条件、数值和结论；事实无法核验时判 others。
    - 后续更直接的系统状态与卡片或回复冲突时，以更直接的状态为准；仍无法确定时判 others，并标记评测证据冲突。
  correctness:
    ok: 简单任务唯一目标完成，或复杂多任务所有生效目标完成，无需用户继续操作；有可验证的最终状态证据；条件任务执行了正确分支；没有影响结果的错误、不当副作用或严重回复质量问题。允许存在不影响理解和任务闭环的少量重复、轻微冗余、措辞偏差等问题，并记录在 issue_types 中。
    nok: 在任务具备执行条件时，任一生效目标未完成、最终步骤未执行、最终状态错误，或发生对象、参数、路径、条件判断、条件分支、意图理解、界面与回复一致性等可归责的执行错误。即使操作结果已经完成，最终文字回复与 query 严重不相关、大段机械重复影响阅读、包含大量无关或乱码等冗余字符，或暴露无必要的检索过程、skill/工具名称、内部推理及思维链等非用户所需的执行信息时，也判 nok。
    no_support: 任务无法完成的唯一根因是助手不能自主补齐的外部条件，包括权限、登录、身份验证、必要信息、硬件或系统能力、应用、目标对象、敏感操作或外部服务。
    others: 不符合 ok、nok、no_support 任一条件的其他类别，包括未预期场景、现有评测分类无法覆盖，或因 query、视频、输入数据、界面呈现等评测侧问题而无法可靠判断。必须通过 issue_types 说明具体原因；如果已经能够确认任务完成、可归责执行失败或客观条件阻塞，仍应分别判为 ok、nok 或 no_support。
  issue_types:
    ok:
      - 重复操作
      - 路径冗余
      - 轻微无关步骤
      - 最终回复瑕疵
      - 其他轻微问题
    nok:
      - 任务未完成
      - 多任务未全部完成
      - 最终步骤未执行
      - 仅文字声称完成
      - 完成证据不足
      - 最终状态错误
      - 操作对象错误
      - 操作参数错误
      - 操作路径错误
      - 条件判断错误
      - 条件分支错误
      - 严重意图偏离
      - 界面与回复不一致
      - 严重回复质量问题
      - 内部过程信息泄露
      - 产生不当副作用
      - 无依据声称受阻
      - 其他执行问题
    no_support:
      - 待权限授权
      - 待账号登录
      - 待信息补充
      - 待身份验证
      - 待用户敏感操作
      - 应用未安装
      - 目标对象不存在
      - 必要硬件缺失
      - 设备或系统不支持
      - 外部服务不可用
      - 其他阻塞原因
    others:
      - 视频损坏
      - 录屏数据不完整
      - 视频无法解析
      - 任务意图不明确
      - 任务要求矛盾
      - 输入数据异常
      - 事实结果无法核验
      - 任务执行窗口未展开
      - 评测证据冲突
      - 未预期场景
      - 其他未归类情况
  decision_order:
    - 先确定当前 query 的有效时间窗、任务形态、条件及实际生效目标。
    - 根据证据规则，将每个生效目标判断为已完成、客观阻塞、评测侧无法判断或可归责未完成。
    - 任一生效目标存在可归责未完成、执行错误或严重回复质量问题时判 nok；所有生效目标完成、无需用户继续操作，且没有影响结果的副作用或严重回复质量问题时判 ok。
    - 不存在可归责错误时，若未完成目标全部由外部条件阻塞则判 no_support；其余因未预期场景或评测侧问题无法可靠判断的情况判 others。
  conditional_rules:
    - 只要求完成条件实际成立后所激活的目标；条件不成立时正确跳过后续动作，也属于完成。
    - 条件判断错误、条件成立却未执行后续动作，或条件不成立却错误执行后续动作，判 nok。
    - 条件依赖用户尚未提供的信息时判 no_support；query 内部条件矛盾、无法确定生效分支时判 others。
  low_level_rules:
    - 只有意图清晰的简单任务被判 nok，且不存在客观阻塞并发生明显可归责的基础执行错误时，才输出 yes。
    - ok、no_support、others 以及复杂多任务固定输出 no；不要仅因结果是 nok 就自动输出 yes。
rubrics:
  - name: 操作完成度
    description: 基于整个 query 判断生效目标和最终文字回复是否完整闭环。
    weight: 0.7
    scale: 5
    criteria:
      - 所有生效目标是否完成且最终状态可验证
      - 是否仍需要用户继续操作
      - 条件任务是否判断并执行了正确分支
      - agent 自述是否与画面一致
      - 最终文字回复是否与 query 相关、可读且能清晰传达结果
      - 最终文字回复是否泄露无必要的检索、skill、工具调用、内部推理或思维链
      - 初始状态是否已经满足用户要求
      - 是否存在助手无法自主补齐的客观阻塞
    score_anchors:
      5: 整个 query 的所有生效目标完整闭环，或初始状态已经满足；最终状态有充分证据支持；最终回复相关、清晰、可读且与证据一致
      4: 所有生效目标已完成，但最终结果存在不影响闭环确认的轻微瑕疵
      3: 已完成主要结果，但简单任务最终动作未执行、复杂多任务仍有至少一项目标未完成，或操作完成但最终回复存在严重质量问题或内部过程信息泄露
      2: 只完成少量结果或中间过程，最终目标明显未闭环
      1: 未执行、最终状态错误、执行相反操作，或只有文字声明而没有任何实际完成证据
  - name: 步骤正确性
    description: 基于整个操作过程判断实际操作路径是否正确、连贯且合理。
    weight: 0.3
    scale: 5
    criteria:
      - 是否发生与 query 相关的实际操作
      - 操作路径是否正确且未缺失关键步骤
      - 是否出现走错、卡住、反复尝试、冗余或无关步骤
      - 合法替代路径、系统自动跳转和关键帧之间缺失的过渡画面不应被判为冗余
      - 只评价当前 query 发出后到任务闭环前的操作，忽略之前的历史内容和完成后的无关行为
    score_anchors:
      5: 当前任务有效时间窗内的实际路径正确、连贯，没有可观察到的冗余、无关或错误步骤
      4: 存在少量冗余、重复点击或无关步骤，但不影响最终结果，可以接受
      3: 存在明显绕路或多次重试，但整体方向正确
      2: 多次走错路径或操作混乱，只完成少量相关过程
      1: 路径完全错误、南辕北辙，或没有发生与 query 相关的实际操作
