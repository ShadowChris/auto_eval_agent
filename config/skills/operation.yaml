name: operation
display: 任务类
matching_categories: []
rules: "任务类（录屏）评测：看录屏关键帧判断操作是否完成意图。务必区分「真的执行」与「只给口头指导/教程而未执行」。"
operation_policy:
  single_turn_scope_rules:
    - 在评价任务执行前，必须先核验录屏中展示的原始用户 Query 能否与评测输入 Query 一致对应。只忽略空格、换行、标点等展示格式差异，不进行同义改写推断。任务执行面板中的规划、步骤文案、工具调用文字和 agent 回复都不能代替原始用户 Query。
    - &single_turn_window 只评价从当前 query 首次发出或开始执行，到任务闭环、失败或录屏结束之间的行为；忽略此前历史内容和完成后的复制、滚动、返回或新任务，除非它改变或撤销目标状态。
  multi_turn_evaluation_scope: latest_turn
  multi_turn_rules:
    - 每轮是一个独立评估 Case，只评价标明的当前轮。提供的第1轮至当前轮 Query、Answer、背景、图片和抽帧用于理解指代、必要参数、用户补充、修改与撤销；不含未来内容，不接收历史裁判结论。先明确最新 Query 实际承接的完整要求，而不是只按最新一句话的字面含义判断。
    - 以下共用标准中的 Query、原始任务和生效目标，均指结合相关历史确定的当前轮实际承接要求，不包含已结束的独立历史任务。
    - 只对当前轮执行原始 Query 一致性门禁：仅忽略空格、换行和标点，不做同义改写推断；无法核验当前轮时判 others / 录屏Query无法与输入Query一致核验，评分全 null。历史只辅助理解，不因无关历史 Query 缺证或错误直接判本轮失败。
    - 对新提出的独立任务，只验收本轮任务；不重复处罚历史独立任务的错操作、遗漏、固定失败或阻塞。若本轮补充参数、选择候选、纠错或确认继续，则按历史还原其所承接目标，不能仅因本轮回答了一句确认就视为完成，也不能把仍相关的必要动作当作无关历史忽略。
    - 原单轮标准适用于本轮生效范围。首轮合理澄清、截至本轮仍缺必要信息时判 no_support / 待用户澄清；后续已补齐且正确执行，本轮可判 ok，历史 no_support 不沿用。历史错设置在本轮被要求纠正并已正确完成，本轮可判 ok，之前的 nok 原样保留。未补齐、未正确承接或本轮仍执行错误时，按实际证据判定，不自动宽免。
    - 用户修改或撤销也是本轮意图，按明确范围处理，正确修改、停止或取消算本轮闭环；不擅自增加撤销范围。判断当前参数与状态须尊重先后顺序，不能将后续输入倒灌到此前轮次的评估；历史证据能证明的现有状态可复用，但不能证明本轮应执行而尚未发生的动作。
    - 维度、问题类型、挂卡和回复质量仅针对当前轮。非空当前轮 answer 优先，否则使用当前轮末段最终视觉回复，不用历史回答替代；不将正常跨轮承接当重复，不处罚历史回复质量。忽略每轮闭环后的复制、滚动、返回等收尾，除非改变或撤销本轮目标状态。rationale 说明当前轮及决定性帧，可引用必要历史依据；task_type 按本轮承接目标的独立结果数量判断，不因历史轮数变多自动判复杂任务。
  scope_rules:
    - 基于整个 query 评估，不要拆成多个独立 case。
    - 简单任务只有一个可独立验收的最终结果；复杂多任务包含多个可独立验收的结果。判断依据是结果数量，不是点击次数。可分别验收不等于必须并行执行；未执行目标是否可归责，取决于实际流程、有效阻塞和独立错误证据，而不是逻辑上能否单独完成。“独立错误”指与阻塞无关且有实际证据的已发生错误，不是“逻辑上可独立完成的目标尚未开始”。
    - 不得擅自扩大 query 的完成边界。先根据完整语义确定验收方式：功能入口、状态变化、查询结果或内容交付，不按“设置”“可以”“能否”等单个词判动作。结合原始意图与明确适用的产品规格确定验收终点，不将特定规格泛化到其他任务。询问功能能力或操作方法不自动要求立即操作；礼貌问句中明确请求执行的仍按动作验收。只有功能、页面或对象名称而没有状态变化要求时，可以按打开、查看或展示该功能入口理解；已经到达 query 所要求的对应页面或展示目标状态时，不得额外要求启用功能、完成协议授权或修改状态。存在多种合理意图且 agent 明确询问时，按待用户澄清判断，不因 query 简短而直接归 others。
    - 参数欠指定设置入口规则：query 已给出目标状态、变化方向、约束或 agent 自主选择授权时，应按状态变化目标验收，不能仅以打开页面交付，也不能仅因缺少精确数值而降格为打开页面；是否仍需用户授权或确认，按既有阻塞规则判断。只有这些条件全部不存在、无法唯一确定状态变化，且剩余决策只是用户主观偏好时，到达与该设置项一一对应的最直接可操作页面才可判完成，不应替用户任意选择。“去设置某功能”或“某功能设置”本身不指定开启、关闭或取值，不能仅凭页面有开启按钮就增加启用目标；上一级或错误页面不算到达。缺少完成任务不可替代的对象、数据、身份或授权时不适用入口例外，按一般阻塞规则判断。
    - 区分幂等状态设置和依赖活动对象的动作指令：关闭定位、开启蓝牙、设为静音等状态设置在当前状态已经符合要求时可以直接完成；停止播放、暂停下载、挂断电话、取消导航等动作必须存在正在运行的媒体、下载、通话或导航对象，活动对象不存在时不能按“初始状态已满足”处理。
    - 同时要求前置判断结果和条件成立后的执行动作时，包含两个可独立验收的结果，按复杂多任务处理。
    - *single_turn_window
    - 评测集中的所有 Query 默认具备对应执行能力，包括第三方应用业务；能力可执行不等于本次已登录、已授权或必要信息齐全。仅先验认可的安全拒绝属于正确响应，普通隐私设置和权限开关操作不适用。按目标分别绑定对象、地点和必要输入，不自动借用其他目标的参数，也不因提及图片就假定已提供可辨认对象。
  query_image_rules:
    - 用户输入图片与文字 Query 共同构成原始任务条件，可用于理解目标对象、待处理内容和操作参数；不得只看文字而忽略图片指代的信息。
    - 用户输入图片是任务输入，不是 Agent 的操作过程或完成结果，不能单独作为任务完成证据；完成情况仍需由录屏关键帧和 Agent 自述交叉判断。
    - evidence_frames 只引用录屏关键帧序号，不包含用户输入图片；用户图片与录屏帧必须按提示中的角色和编号分别理解。
    - Agent 对图片中的对象、文字、地址或内容理解错误，并因此操作了错误对象或产生错误结果时，沿用任务结果错误、其他执行问题等现有 issue type，不新增图片专属 correctness。
    - 用户图片文件缺失、损坏或无法解析属于评测输入错误，应在模型评估前失败；图片可以读取但其内容不足以提供完成任务所必需的信息时，才按实际情况考虑 no_support / 缺少前置条件。
    - 先按图文共同确定用户要求的是图片描述、文字提取、相似图片检索还是跳转操作，不得替换任务。要求检索相似图片时，仅解析或描述原图不属于合格交付，判 nok / 应执行目标未执行或任务结果错误；图片解析可以是检索的中间步骤，但不能代替对应检索结果。图片技能导航的页面交付规格仅用于该业务子类，不免除其他图片任务的实际交付要求。
  evidence_rules:
    - 先核验录屏中的原始用户 Query 与输入 Query。内容不一致，或未展示完整、被遮挡、模糊、无法辨认，导致无法一致核验时，直接判 others / 录屏Query无法与输入Query一致核验，所有维度和总分填 null，停止后续任务执行评判。只忽略展示格式差异，不进行同义改写推断；任务执行面板的规划或步骤、工具调用文字、agent 回复都不能代替原始用户 Query。
    - 必须同时检查按时间顺序的视觉证据和 agent 文本自述，不得只依据其中一路下结论。区分原始用户指令、界面结果、用户操作指引、系统流程状态和 agent 最终回答；每个结论引用对应帧或原文，不将流程步骤当成实际结果。同一自述在正文和面板重复渲染仍是一个来源，不增加完成证据，也不据此标回复语义重复。
    - 先确定界面元素的语义：默认值、历史搜索词、占位词、推荐词、商品直播或候选展示不等于本次已经提交、选定、购买或设置。只有看到实际输入、提交或对应结果才能认定操作对象错误；页面明确无匹配结果时，下面的替代候选不等于 agent 已选错。用户必须选择或确认的候选仍属等待用户，不因候选外观判任务结果错误。
    - 证据是否充分取决于其展示内容及适用产品验收终点，而不是载体或中间过程是否完整。可见最终状态、具体执行反馈或先验认可的交付标志足以证明目标时即可认可，不追加完整点击过程或额外结果页。设置结果卡片直接显示目标开关状态或当前值即可证明状态。每个生效目标都须有足够完成依据。同一结果或后续交付足以证明多个目标时，可以共同使用；不得仅凭执行顺序或其中一个目标完成，就推定其他目标完成；缺少反证不等于完成，只有一句完成声明且无其他依据的普通任务仍不足以判完成。
    - 查看当前状态或展示列表时，与目标和范围匹配的现有系统页面、状态控件、结果列表或状态栏也可作为结果来源，不要求 Agent 新建证据、专门跳转诊断页或展示状态变化；证据能证明的范围以可见内容为限，例如已连接图标不能单独证明全部网络服务正常。只要求查看某列表时，正确打开目标系统列表且实际条目状态可读，可以由界面交付，不因还需阅读或滚动查看就要求另作文字复述。明确要求汇总、筛选、比较、统计或完整覆盖指定范围时，仍须完成这些要求；部分列表不能证明全范围结论。
    - 小艺帮记保存目标出现与本次需求对应的小艺帮记卡或保存确认中的蓝色“去查看”任意一个，即视为该保存目标完成，不要求同时出现，也不要求点击链接二次验证；不能仅因只出现其中一种而判缺少可验证结果。用户明确指定的应用、保存位置和能力要求仍须满足。本业务中，对应的小艺知识空间保存结果可验收小艺帮记目标，名称差异不等于错应用或错位置；仍需实际完成依据，不能仅凭助手声称已保存认定完成，也不泛化到其他应用或任意收藏功能。有效帮记卡与黑字“去查看”并存时，不能仅凭黑字覆盖卡片依据。没有有效卡或蓝链且已辨明只有黑字“去查看”时，沿用 nok / 任务结果错误；颜色不清且无其他充分依据或独立错误时判 others。未出现两种标志不能直接推导NOK，仍按实际执行、失败或缺证判断。不据此判复杂任务其他目标完成。纯文本不能证明颜色；卡片计挂卡，纯文字链接不计挂卡。固定失败反馈仍按固定失败规则处理。
    - 生成Excel、PPT、Word等文档时，与本次需求对应的文档生成卡本身就是该生成目标的完成证据，生成中或已生成均可。不以完整标题、正文或下载入口作为识别文档卡的前提，也不因缺少这些内容判不可验证。
    - 只有泛化的“正在操作/已完成”、工具名称、目标入口、轨迹或自述，不能单独证明任务完成；先核对是否已有足够业务结果或适用产品先验，不因缺少完整中间过程或额外结果页否定这些依据。确实不足以判断且没有独立错误或有效阻塞时判 others / 未展示可验证结果；不得推测抽帧遗漏。严格区分目标未执行、实际结果错误和缺证，同一目标不能同时使用两者。结果与要求的冲突实质影响任务完成时记任务结果错误。功能入口未曾实证到达且直接证据证明仍停在上级或错误页面时，判应执行目标未执行或任务结果错误；已达到验收终点且未撤销，不因随后返回改判未执行。
    - 仅对验收终点要求实际提交、触发或状态生效的目标，区分前置准备和核心动作执行。进入对应应用、跳转目标页面、找到目标对象、详情卡和动作按钮不能证明核心动作已经执行；直接证据证明结束时仍停在准备步骤、未执行且没有客观阻塞或用户指引时，判 nok / 应执行目标未执行。目标专属的直接触发、执行中或执行完成反馈可以作为执行证据；缺少直接证据确认是否执行且无独立错误时判 others，不以缺少触发信号本身证明未执行。播放尤其如此：搜索结果卡、影视详情卡、播放按钮、普通应用跳转、打开视频应用、模糊的应用加载画面，不能证明播放动作已经发生；播放专属的直接信号包括播放器、进度、暂停按钮或“正在播放/播放中”。只有直接证据证明结束时仍停在准备状态、未执行且无有效阻塞时才判 nok；仅因未见播放信号、画面跳转或模糊而无法确认是否执行时判 others。
    - 不要求前后状态变化对比；幂等设置的最终画面或初始状态直接满足 query 即可。停止播放、暂停下载、挂断电话、取消导航等动作没有对应活动对象时，判 no_support，并标记缺少前置条件。关键帧未展示全部过渡过程不等于步骤错误；但须先排除“录屏仅展示已完成回答”的评测输入异常。
    - 区分“查询结果为空”和“动作缺少目标对象”。查询设备、账号或应用内真实状态时，有结果与无记录使用同一证据门槛：须有目标对应的业务页面、列表、状态控件或结果卡；独立业务结果已证明“未找到、无记录、未绑定、尚未创建”时，查询本身可完成，不因为结果为空就额外要求用户创建、绑定或添加对象。仅文字声称“没有结果/找不到”而无查询证据时判 others；查询步骤、工具名及完成勾选不能将该自述升级为独立业务结果。知识问答、写作等正文交付不适用此限制。若缺少绑定、登录或输入导致原状态尚不能查询，再检查必要阻塞资格。页面仅显示“搜索中/加载中”不能证明查询完成；无独立错误判 others，明确完成声明与可见仍在加载的结果状态冲突才判 nok / 回复与界面不一致。删除、分享、粘贴等实际动作没有目标文件、剪贴板内容或活动对象时，按前置条件判断，不能因为成功进入页面或展示空状态就判 ok；恢复应用按应用管理页验收，不要求存在可恢复应用。
    - 查询证据必须对应本次目标。泛化的“执行查询”“调用工具”“已完成”不能代替真实查询页面、结果列表、结果卡或明确空结果。当前画面只展示列表的一部分或没出现目标，不足以证明该对象客观不存在；须有完整搜索后明确显示无结果、覆盖目标范围的列表或直接产品先验。
    - 任务执行窗口始终处于带“查看/点击查看”入口的缩略状态，过程和结果均不可见且无其他证据时，判 others，优先标记任务执行窗口未展开，相关评分维度填 null；窗口曾展开或已有直接结果时正常评价。
    - 已给出的回答/方案也须验收：结合用户明确要求、任务目的及实际影响判断。对象错误、关键条件冲突、遗漏明确要求的交付目标等，实质影响任务完成时，才记任务结果错误；不能用“核心诉求大致满足”省略明确要求。用户明确指定的应用、平台、保存位置或交付渠道属于任务要求，不能仅因替代结果用途相近，就降为轻微瑕疵；是否满足这些要求按可见证据判断，不因中间过程未展示就推定使用了错误应用。不得用当前单值替代要求的集合、一个平台替代多平台比较，或通用建议替代缺少个人信息的具体答案。一般表达差异、未指定的格式差异、轻微遗漏或合理近似，不影响任务完成时不单独导致整体NOK；合理近似不得放宽用户明确要求的精确条件。不核查外部真实性，不仅凭裁判偏好、无法核实或未要求的附带细节不足判错。适用产品先验的目标按其验收终点判断，不追加正文核验。本机状态查询的答复也要检查；仅“已设置/已查询”等完成声明不证明实际执行；查询本机或应用内的配对设备、记录、设置等真实状态仍适用查询证据规则。
    - 核验已交付结果后，对尚未交付原因完成“阻塞证据门控”：逐帧扫描并逐字摘录面向用户的登录、授权、同意、验证、补充、选择或确认原文，再从完整 agent 文本中逐字摘录“无法/缺少/未提供/请提供/请选择/是否/请确认”等具体条件说明。注明来源与帧号，不得意译或补写原文中没有的询问。协议说明配合“取消/同意”等按钮也可证明指引；普通“登录”入口、“查看”按钮、“手动操作中”状态、加载动画和流程“已完成”本身不算。
    - 阻塞证据门控的映射是强约束。判 no_support 前必须逐项写明 A.用户必须补充的信息或完成的具体动作；B.为何是继续原任务不可替代的条件；C.最后有效状态中该阻塞是否仍未解除；D.阻塞前是否已有足以独立导致失败的可见错误。只有 A/B/C 成立且 D 为否才允许整体 no_support。筛选范围或偏好不等于已选定唯一对象，也不等于授权助手自动选择；需要用户选择具体候选时，最终文字询问本身就可证明待用户澄清，不要求另有登录或预订界面。候选航班、场次或商品尚需用户选择时，先完成这项门控，再判断核心动作未执行。用户不负责选择 agent 的搜索、导航、工具或补救策略；“需要我继续到设置中查找吗”“换关键词、换入口还是上报”只是错误后的恢复询问，不能把此前可见错误改写为等待用户。
    - 必要参数、个人信息或候选选择缺失时，不要求 agent 在询问前先打开应用；合理搜索未找到 query 指定对象后，询问补充对象或放宽条件可以是必要澄清。query 与可信背景已提供信息时，不相关关键词、找错入口或重复确认不能变成客观阻塞。对操作影响或范围的必要确认，不等同于重复询问已经明确的用户原意。静态隐私说明、帮助文案、风险提示或协议链接不是授权阻塞；明确能力受支持的专家经验也不证明本次已授权。前置条件知识只说明条件存在，不能凭泛化失败自述推断该条件实际缺失。“可能未开启/也许未授权”等推测不证明本次条件确实缺失；无其他条件依据时，不能凭推测豁免明确无法执行的答复。第三方业务也默认具备执行能力，但不能据此忽略真实阻塞或推定任务完成。
    - 对未完成目标必须识别其最后有效状态。用户实际答复、选择、确认、完成登录授权，或进入应用内容、搜索结果、商品详情等阻塞后的页面时，旧阻塞立即解除，解除后必须重新评价剩余目标，即使后续执行错误或不完整；仅返回桌面或助手界面不算解除。“无法继续”“请自行操作”“相关工具已返回结果”等泛化终止语只有在同时提供真实必要的缺失条件或用户下一步动作依据时，才算阻塞证据；仅将原因写成“不支持、功能不可用、技术受限”不能证明客观阻塞。
    - 复杂多任务按实际串行执行链判断。正确流程在真实必要且仍有效的用户阻塞处停止时，后续尚未开始的目标属于串行中断后果，即使这些目标逻辑上不依赖同一信息，也不单独判遗漏；裁判不得假设 agent 应当暂停当前步骤改为并行。仅因其他目标未展示结果，不能反推阻塞前已经漏做；也不强制按 query 的语句顺序执行。阻塞前已有实际错操作、错误交付、与直接证据冲突的完成声明，或阻塞后确有其他目标实际执行时，才另行核对独立问题。任务面板后续步骤文案和勾选不证明继续执行或阻塞解除。已经明确等待用户的目标，不得再因用户未响应而记错；缺少用户后续操作和最终结果只是阻塞的必然后果。
    - 录屏停在登录、授权或身份验证页面且有明确用户指引，或明确反馈本次任务已因等待而超时、终止时，可判 no_support。只有同时满足以下条件时才判 nok / 三方应用跳转中断：停在普通登录入口或登录页面，界面、任务执行文字和 agent 均无任何澄清或用户操作提示，agent 最终回答为空，没有因等待用户而超时或终止的反馈，流程静默停止；回复非空不自动等于 no_support。
    - 固定失败文案按完整语义映射：“无法为你继续操作了”或“无法继续为你操作了”是 nok / 执行中断，即使同一回复前面声称已完成，也不能忽略或解释成正常结束话术；“小艺算力不够了，请稍后再试”和“遇到一点小问题，请稍后再试”是 others / 环境或算力异常；“无验证结果”映射为 others / 未展示可验证结果。已经存在独立执行错误时，后续异常或恢复询问不能覆盖错误。
    - 区分能力拒绝与执行缺证：answer 或最终视觉回答无有效安全拒绝、真实阻塞或临时异常依据，却明确声称“不支持、功能不可用、技术受限、无法执行”，判 nok / 应执行目标未执行，须引用拒绝原文，不能因没有操作画面降为 others。无直接证据证明是否执行、无明确拒绝或独立错误及有效阻塞时，一律判 others / 未展示可验证结果，不要求先证明曾尝试。可见最终结果也是直接证据。固定异常话术优先于一般拒绝规则。
    - 先定位主对话消息流，再逐个核验载体资格。对话卡作为消息内容占据自己的位置；临时浮层悬浮遮挡或压住原消息，即使背景仍是助手对话也不算挂卡。带“设置”来源、调节滑块/开关并浮盖消息的控制面板是操作弹窗，不是回答卡；不能仅因圆角外观或出现在助手界面就归 other。排除后再识别类型，全部不合资格则 cards=[]；这些控件仍可作为操作证据。
    - 挂卡只统计本次任务在智能助手主对话消息中嵌入的视觉卡片、图片或视频。离开主对话的APP/系统页面、设置弹窗（即使覆盖主对话）、悬浮操控窗口、步骤/进度面板、“已完成/参考若干篇资料”、按钮、纯文字及历史卡必须排除，不能以 other/unclear 保留。记忆配置开关、设备选择及通用生成进度面板也必须排除，不能用 other 保留。对应文档生成卡即使展示生成进度，仍按文档卡识别，不属于此处排除的通用进度面板。配置控件关闭不证明内容保存失败，认定错保存位置或错能力前须有实际创建或保存内容的证据。非挂卡的页面和弹窗仍是有效操作证据；不得因不计挂卡而忽略错对象、错参数或错保存位置。同一卡跨帧只记一次。
    - 逐卡先核对保存位置及目标能力，再按适用产品先验检查对象与内容。已定义类型固定标准名，未知类型用 other 和简短类别名；内容、标题、括号备注不进入类型。相关搜索/详情准备卡可为 supporting/suitable，但不证明后续播放、下载或预订完成。agent 的文字承诺不能补足卡片未证明的额外能力或动作。错对象、关键参数、保存位置或错能力实质影响交付时判 unsuitable；替代必需结果的错卡是已交付错误，判 nok / 任务结果错误。内容还不完整、其他动作尚待授权，不消除实际载体错误。帮记卡与文档生成卡按各自已认可终点判断，不以正文不可见或仍在生成否定交付；普通图片核验可辨认内容，无法辨认的部分结合关联文字和上下文判断，不仅因无法精确鉴定否定交付，也不因有图而免除需求核验。没有适用先验且能力或关键事实确实无法判断时用 unclear；额外无关卡另记无关挂卡，未收录卡只从可见字段或控件判断能力。
    - 当前不进行外部事实核验，不凭印象判断对象身份、真实时间或事实真伪。只有 Query 明确要求鉴定、辨认或核验身份、真实性等关键事实，且决定验收而现有信息不足时，判 others / 关键事实待核验，rationale 指明待核验内容。普通找图只点名对象不自动触发鉴定；结合关联文字与上下文对应需求的已返回图片，按图片交付先验验收。不将普通回答无来源转复核，不以无法核验判错。已有实质影响任务完成的需求约束冲突或独立执行错误仍优先 nok；确实受影响卡片用unclear，不可判断维度填null，其余照常评价。
    - 回复与界面不一致须同时引用 agent 原句中的明确事实断言和与之冲突的直接业务证据；不能把多余追问或未确认完成改写为否认已交付结果，不得把问句意译成原文没有表达的否认。问句包含明确错误前提时仍须核验。画面已完成而只说打开页面，属于回复不够完整，不等于回复与界面冲突。系统步骤不属于回复；通用回复质量问题另记 issue，不改变执行根因。
  correctness:
    ok: 简单任务唯一生效目标完成，或复杂多任务所有生效目标完成，无需用户继续操作；幂等状态设置的初始状态已经满足也属于完成。停止播放、暂停下载、挂断电话、取消导航等依赖活动对象的动作在对象不存在时不属于初始状态已满足。条件任务正确获得前置信息且正确执行实际分支，条件不成立时正确跳过后续目标也属于完成。对要求查询、展示或泄露账号密码、支付密码、验证码、私钥等敏感凭据的任务，agent 明确说明安全或隐私原因并拒绝披露，属于正确完成安全响应；该规则不适用于普通隐私或权限设置。内部过程信息泄露、回复语义重复、重复系统卡片及不影响结果的轻微过程问题只记录 issue_types，不直接改变 correctness。
    nok: 存在影响任务结果或闭环的可归责错误，包括已生效且具备执行条件的目标或必要动作未执行、任务结果与 query 的冲突实质影响任务完成、无明确系统异常或有效用户交互却停止或卡住、三方应用跳转后静默中断，或回复与可见界面冲突。仅仅未展示可验证结果不属于可归责执行错误，应判 others；只有同时观察到独立的漏执行、结果错误、执行中断或回复冲突时，才由该独立错误判 nok。回复“无法为你继续操作了”只表示操控执行失败，未提供临时异常、客观阻塞或用户下一步，属于 nok / 执行中断。回复内部矛盾只有在影响最终结果理解或内容交付时才判 nok。已观察到的结果性执行错误优先于后续的临时异常或能力不支持声明，也优先于错误发生后的恢复性询问；理解成错误任务、采用明显不相关的入口、query 信息充分却重复询问，以及先发生可见错误后再询问用户换路径，都不能被后续询问洗成 no_support。所有 Query 默认具备执行能力；未命中先验认可的安全拒绝，也无真实阻塞或临时异常依据时，agent 直接拒绝执行或声称不支持、功能不可用、技术受限，属于 nok / 应执行目标未执行，不以缺少操作画面降为 others。
    no_support: 没有独立执行错误，但有依据的必要外部条件缺失使任务无法闭环，如登录、授权、必要信息、候选选择、目标对象、硬件或活动会话缺失；不能覆盖已经发生的错误路径、无关操作或执行失败。能力拒绝声明本身不构成阻塞；不再要求专家经验或同一目标的成功记录反驳该声明。正确路径上的阻塞须必要且结束时仍有效，解除后重评剩余执行。客观前置条件已有直接证据时，不强制要求 agent 再重复说明；未解释原因只作为回复体验问题，不单独改判 nok。阻塞的具体证据按下述规则判断。
    others: 不存在优先级更高的可归责执行错误，且因现有证据不足、关键事实待核验、临时系统或评测输入异常而无法完成或可靠判断。包括没有直接证据确认是否执行或完成，且无明确拒绝、独立错误或有效阻塞；agent 明确说明“小艺算力不够了，请稍后再试”“遇到一点小问题，请稍后再试”等资源或服务临时异常；系统或 agent 明确反馈“无验证结果”；外部服务暂时异常；以及 query、视频、输入数据或界面呈现异常。不得把已经观察到的漏执行、结果错误、执行中断或回复冲突降级为 others。
  issue_types:
    内部过程信息泄露:
      allowed_correctness: [ok, nok, no_support, others]
      description: 最终回复暴露无必要的内部推理、检索、skill 或工具调用过程，例如“我先想想任务规划”“加载某技能”“没有匹配的技能”“调用某工具/接口”。有非空 answer 时只检查 answer；否则只检查录屏末段明确面向用户的最终视觉回答。必须引用该来源的泄露原句；系统 step info、步骤/函数/工具名和流程状态不能充当泄露证据。面向用户的产品、服务或协议名称本身不是内部调用过程。该问题只记录 issue，不直接改变 correctness。
    回复语义重复:
      allowed_correctness: [ok, nok, no_support, others]
      description: agent 回复前后重复表达相同含义；该问题默认不直接改变 correctness。
    回复内容自相矛盾:
      allowed_correctness: [ok, nok, no_support, others]
      description: agent 回复内部出现相互冲突的描述；只有矛盾影响最终结果理解或内容交付时才判 nok。
    重复系统卡片:
      allowed_correctness: [ok, nok, no_support, others]
      description: 同一任务出现内容相同或高度重复的系统结果卡；只有重复执行产生错误结果或副作用时才影响 correctness。
    重复操作:
      allowed_correctness: [ok]
      description: 存在不影响最终结果的重复点击或重复执行。
    路径冗余:
      allowed_correctness: [ok]
      description: 操作路径存在绕路，但最终结果正确闭环。
    轻微无关步骤:
      allowed_correctness: [ok]
      description: 存在少量无关步骤，但不影响最终结果。
    其他轻微问题:
      allowed_correctness: [ok]
      description: 任务正确闭环，但存在其他不影响 correctness 的轻微问题。
    无关挂卡:
      allowed_correctness: [ok, nok]
      description: 录屏中的结果卡与 query 全部生效目标及必要过程明显无关。目标已经正确闭环时只记录本问题，不改变 ok；无关卡取代必需结果时判 nok，以任务结果错误为主因，本类型可作为次要问题。不要把其他未知类型的相关卡片、历史任务卡片或必要过程卡片误判为无关。
    应执行目标未执行:
      allowed_correctness: [nok]
      description: 具备执行条件且已生效的目标或必要动作有直接证据证明未执行；按已确定的验收终点判断，仅对仍要求实际动作的目标，将进入应用、跳转页面、前置查询、详情卡或动作按钮视为准备步骤。播放目标只见准备页面或模糊跳转而无法确认是否执行时属于缺证，不能仅因没见播放器就判未执行。不包括已实证达到验收终点、条件未触发、明确缺少前置条件，或界面、最终回答已经明确等待用户操作的目标。rationale 必须指出具体目标和直接未执行证据，或无有效例外的明确拒绝原文。
    任务结果错误:
      allowed_correctness: [nok]
      description: 已经执行或交付结果，但结果与用户明确要求、可见证据或已知条件的冲突实质影响任务完成。也包括未作必要澄清并实际交付无法对应原意的答案或执行其他任务，须引用原始歧义与实际答复。一般表达差异、未指定格式、轻微遗漏或合理近似不影响任务完成时，不单独导致整体NOK；不得放宽明确的精确要求或遗漏明确交付目标，不仅凭偏好、无法外部核验或附带细节不足判错。
    执行中断:
      allowed_correctness: [nok]
      description: 没有明确的临时系统异常，界面和 agent 最终回答也没有用户操作指引，普通任务执行过程停止、卡住、静默超时或异常循环未结束。
    三方应用跳转中断:
      allowed_correctness: [nok]
      description: 跳转到第三方应用后未进入正确目标流程，或停在普通登录入口、登录页、首页等中间状态，且界面、任务执行文字和 agent 均无澄清或用户操作提示、agent 最终回答为空、没有等待反馈并静默停止；能够使用该类型时，不再同时输出普通执行中断。登录、授权或确认界面存在明确指引时，按缺少前置条件判断。
    未展示可验证结果:
      allowed_correctness: [nok, others]
      description: 没有直接证据确认对应目标是否执行或完成，且无明确拒绝、独立错误或有效阻塞时，一律判 others / 未展示可验证结果，不要求先证明曾尝试；也包括 agent 仅用文字声称查询“没有结果/找不到”，但没有任何对应查询过程、状态或结果画面。该问题本身主判 others。复杂任务同时存在其他独立可归责错误、整体因此判 nok 时，本类型可作为次要问题。不得推测是否由抽帧遗漏造成。有直接证据证明目标未执行时使用应执行目标未执行，不能仅因没看到操作就认定未执行；已观察到错误结果时使用任务结果错误；目标已明确等待用户操作时，缺少最终结果是阻塞后果，不使用本类型。
    回复与界面不一致:
      allowed_correctness: [nok]
      description: agent 原句中的明确事实断言与可见结果、对象或参数冲突；必须引用冲突原句，否则不得标记。系统步骤、勾选、“√已完成”“超时，任务终止”等流程状态不是回复。
    其他执行问题:
      allowed_correctness: [nok]
      description: 已确认存在影响结果的可归责执行错误，但现有 nok 类型无法覆盖。
    待用户澄清:
      allowed_correctness: [nok, no_support]
      description: 为继续完成原始任务，界面、任务执行过程文字或 agent 最终回答已向用户发起明确询问，并且确实缺少用户必须补充的信息、对象、选择或确认；即使前置查询、搜索、导航到目标页或内容准备等步骤已经正确完成，只要原始任务仍需用户答复后才能继续，仍属于待用户澄清；也不要求询问前先打开应用或执行表面步骤。自动接听、日程、联系人或地址、机票酒店门票等任务确实缺少必要参数或候选选择时，可以先澄清。多个目标共享同一对象、搜索词、候选选择或预订偏好时，该澄清可同时阻塞这些依赖目标。合理搜索未找到 query 指定对象后，询问修改关键词、补充对象或放宽条件也属于必要澄清，除非搜索对象、关键词或路径本身错误。query 已经明确给出所需信息时，重复确认用户原意，或在理解错误、错误应用、不相关关键词、错误路径、未找到正确入口、工具或技能失败后询问是否换路径、换入口、继续查找或上报，不是必要澄清，不能覆盖此前的可归责错误。复杂任务整体因其他真正独立目标错误判 nok 时可作为次要问题。
    缺少前置条件:
      allowed_correctness: [nok, no_support]
      description: 有依据地缺少图片、内容、应用、登录、授权、身份验证、目标对象、硬件或活动会话等无法自主补齐的必要外部条件；缺失须由原始输入、界面或可信先验核实。agent 明确说明缺少完成任务所需的信息并指引用户提供时也属于本类型。登录授权须有明确用户指引，且阻塞由正确路径触发、结束时仍有效。不能仅凭能力不支持、功能不可用或技术受限声明使用本类型。复杂任务因其他独立错误判 nok 时可作次要问题。
    其他阻塞原因:
      allowed_correctness: [nok, no_support]
      description: 已确认不存在当前目标的可归责执行错误且受到客观条件阻塞，但不属于待用户澄清或缺少前置条件。
    环境或算力异常:
      allowed_correctness: [nok, others]
      description: agent 明确说明算力不足、系统繁忙、遇到临时问题或稍后重试；包括“小艺算力不够了，请稍后再试”和“遇到一点小问题，请稍后再试”。复杂任务整体因其他目标错误判 nok 时可作为次要问题。
    外部服务暂时异常:
      allowed_correctness: [nok, others]
      description: 有具体临时故障依据的外部服务不可用，重试后可能恢复；仅声称功能不支持或技术受限不属于临时异常，应按默认可执行和拒绝规则判定。
    视频损坏:
      allowed_correctness: [others]
      description: 输入视频内容明确损坏，无法用于评测。
    录屏数据不完整:
      allowed_correctness: [others]
      description: 输入的录屏数据本身明确不完整；不得根据关键帧中没有某状态而推测抽帧遗漏。
    录屏仅展示已完成回答:
      allowed_correctness: [others]
      description: 当前轮有效录屏从首帧起就已展示该轮完整最终回答，后续始终停留同一主对话完成态，未见本轮发送、回答生成、执行或其他可确认本次交互发生的证据。时钟、光标等无关微动不算交互。Query 一致性门禁通过后，此类录屏作为独立输入异常门禁，原判 others，need_review_cate 标记本类型，所有维度和总分填 null，停止执行评判；不能仅凭现成回答或卡片判 ok，也不据此归责 agent 未执行或执行中断。已展示本轮发送、生成、操作或业务状态变化后停留结果页，不命中；正常静态系统页面、幂等设置初始状态已满足，以及多轮中历史轮的已完成回答不因此命中。多轮只检查当前轮对应帧，不以整个历史前缀的首帧判断本轮异常。仅缺少中间步骤、关键帧较少或只有一张结果图，不足以推断全程停留完成态。
    视频无法解析:
      allowed_correctness: [others]
      description: 输入视频无法被系统正常解析。
    任务意图不明确:
      allowed_correctness: [others]
      description: 输入本身损坏或无法形成可执行澄清，导致评测无法建立任务目标；不用于豁免 agent 对普通歧义的错误处理。意图有歧义时，必要澄清按待用户澄清；未澄清却擅自作答、无法对应原意，判 nok / 任务结果错误。
    任务要求矛盾:
      allowed_correctness: [others]
      description: Query 内部要求互相矛盾，无法确定可执行目标。
    输入数据异常:
      allowed_correctness: [others]
      description: Query、上下文、媒体路径或其他评测输入存在异常。
    录屏Query无法与输入Query一致核验:
      allowed_correctness: [others]
      description: 录屏中的原始用户 Query 与评测输入 Query 内容不一致，或原始用户 Query 未展示、展示不完整、被遮挡、模糊、无法辨认，导致无法确认二者对应。只忽略空格、换行、标点等格式差异；不得用任务执行面板的规划或步骤文案、工具调用文字、agent 回复代替原始用户 Query。
    任务执行窗口未展开:
      allowed_correctness: [others]
      description: 任务执行窗口始终处于缩略状态，过程和结果均不可见，且没有其他证据可供判断。
    关键事实待核验:
      allowed_correctness: [nok, others]
      description: Query 明确要求鉴定、辨认或核验身份、真实性等关键事实且决定验收，现有信息不足，等待人工复核。普通找图仅点名对象不触发；不主动外部查证、不凭印象判真假。无独立错误主判others；已有实质影响任务完成的约束冲突或独立执行错误时整体nok可共存。普通回答无来源、无关细节不触发。
    评测证据冲突:
      allowed_correctness: [others]
      description: 多项可见证据互相冲突，无法可靠判断最终状态。
    未预期场景:
      allowed_correctness: [others]
      description: 出现现有 correctness 和 issue type 未预期覆盖的评测场景。
    其他未归类情况:
      allowed_correctness: [others]
      description: 已确认应判 others，但现有类型无法覆盖。
  review_category_names:
    - 待用户澄清
    - 缺少前置条件
    - 其他阻塞原因
    - 未展示可验证结果
    - 环境或算力异常
    - 外部服务暂时异常
    - 视频损坏
    - 录屏数据不完整
    - 录屏仅展示已完成回答
    - 视频无法解析
    - 任务意图不明确
    - 任务要求矛盾
    - 输入数据异常
    - 录屏Query无法与输入Query一致核验
    - 任务执行窗口未展开
    - 评测证据冲突
    - 关键事实待核验
    - 未预期场景
    - 其他未归类情况
  decision_order:
    - 首先执行 Query 一致性门禁；未通过直接输出 others / 录屏Query无法与输入Query一致核验，停止后续任务执行评判。
    - Query 门禁通过后，按“录屏仅展示已完成回答”的定义检查当前轮录屏；命中则原判 others，need_review_cate 记录该类型，所有评分填 null 并停止执行评判；未命中才继续验收任务结果。
    - 挂卡验收先锁定原Query的保存位置和能力约束。已经创建的内容保存结果落入错误位置或缺少要求能力并实质影响交付，是结果错误，不是尚未创建；不得自行增加“先记录请求/临时保存”的目标，把已持久化的错结果降为 supporting/suitable。必要的搜索/详情准备卡不等于内容保存行为；用户明确允许临时保存或多处保存时按其授权判断。后续授权阻塞不能消除已有错保存结果。
    - 按任务范围规则确定验收终点，锁定原始任务的完成边界和关键约束：对象、范围、时间、数量、保存位置、比较要求及条件。只要求查询或展示时不增加操作；预订、下单、发送、发布等实际动作的前置查询结果只是执行过程，不能提前判 ok。不能用“核心诉求大致满足”省略明确要求。
    - 按时间顺序联合检查全部视觉证据与完整自述，区分默认/候选、执行过程、具体结果、用户指引及系统流程状态；以相关专家经验解释能力，不补造执行事实。结果栏可记录实际界面结果及已交付正文/方案；“已操作/已查询”等完成声明单独记录，不能证明实际执行。知识与内容交付可验收文字；本机或应用内真实状态查询须有对应业务结果来源。
    - 先对已交付结果（含保存确认、合格卡片）按适用产品验收终点与原目标约束核验，实质影响任务完成的错对象、关键参数、保存位置或能力冲突记为独立结果错误；再核验阻塞资格及是否解除。真实必要阻塞只解释尚未交付目标，不撤销已经发生的错误；串行后续未开始目标不单独记漏项。符合条件时优先标记三方应用跳转中断。
    - 对每个目标优先识别最直接根因：已完成、等待用户、缺少前置条件、临时异常、应执行但未执行、执行中断、结果错误或证据不足；同一个目标不要同时记录根因和其必然后果。逐项核对原目标关键约束与条件核验，结果卡本身合适不能代替所有目标闭环；已认可的产品闭环不追加正文、完整中间过程或额外结果页验证。已经交付的结果卡存在实质影响任务完成的对象、关键参数或保存位置错误，是独立结果错误，不能用其他目标正在等待授权或选择来覆盖；仅未交付的目标才检查是否为阻塞后果。
    - 整体映射：先检查已发生且有证据的可归责错误，有则 nok；否则所有生效目标完成或正确跳过时判 ok；否则存在必要且未解除的外部阻塞时，将正确停止流程中尚未开始的目标按串行待续处理，整体 no_support，不因其他目标理论上可独立执行而判 nok。部分完成加有效阻塞不是 ok；只有实际错操作、错误交付、明确失败或与已知状态相冲突的完成声明，才能突破阻塞判 nok。剩余证据不足、临时异常或评测输入问题判 others。不从维度分推导 correctness。
    - 原判 nok 时 issue_types 第一项是执行主因；原判 no_support 或 others 时 need_review_cate 第一项是阻塞或复核主因。rationale 写清目标、最后有效状态、决定性帧或原文及理由；通用质量问题不能作为 nok 的第一项。
    - 确定执行根因后，独立检查回复质量：先锁定非空 answer，否则使用末段最终视觉回答；只从该来源摘录泄露、重复或矛盾原句。重复系统卡片另按视觉证据检查。不因已确定 correctness 而省略，也不把步骤栏混入最终回答。
    - 输出前反查 ok：查询设备或应用内真实状态时，助手回答区域重复出现同一自述仍是单一声明，不是独立查询证据。只有函数/步骤和最终回复而无对应查询结果界面、列表、状态或结果卡时，不允许 ok，应判 others / 未展示可验证结果；不要将此类任务混同可纯文字交付的知识问答。
    - 输出前反查 nok：有效且必要的候选选择、登录或澄清尚未解除时，不能用同一目标缺少最后动作或其他尚未执行目标作为独立错误；必须引用实际错操作、错误交付、明确失败或虚假完成声明。询问“哪一班/哪个场次/哪个商品”是用户选择，不是要求用户替 agent 选择执行策略。只见目标没有回答、没有展示，不足以证明独立漏执行；有有效阻塞时，不从“页面已经打开、理论上能做、query 中排在前面”推断该目标本应另行完成。
    - 输出前反查 no_support / others：当前时间窗内已交付且实质影响任务完成的错卡、错误参数、错误保存位置或自然语言虚假完成声明，不能被先前或后续阻塞覆盖。依据能力或画面认定目标无法完成时，随后仍声称已经完成不是阻塞的必然后果，而是独立结果冲突，判 nok。cards 中替代必需结果的 direct/unsuitable 必须对应已发生的结果错误；整体不能同时解释为纯阻塞。
    - 完整回复中出现固定失败文案“无法为你继续操作了 / 无法继续为你操作了”时，最终必须判 nok / 执行中断；不得因前面有完成声明、画面部分或全部目标已完成而跳过该映射。该明确失败反馈不是通用轻微质量问题。
  conditional_rules:
    - 只要求完成条件实际成立后所激活的目标；条件不成立时正确跳过后续动作，也属于完成。
    - 已获得前置信息但条件判断错误、条件成立却未执行后续动作，或条件不成立却错误执行后续动作，判 nok。
    - 因用户未提供必要信息而无法判断条件时判 no_support；因临时系统或外部服务异常无法获得条件信息时判 others；query 内部条件矛盾、无法确定生效分支时判 others。
    - 必须区分“已核验条件不成立”和“没有能力或信息核验条件”。只有实际完成核验并获得无目标、无风险、无人符合等可信结果时，才能按条件不成立跳过后续动作并判 ok；条件没有得到核验时，不能把“无法核验”解释成“核验结果为空”；有真实必要信息缺失判 no_support，有临时异常判 others，无依据拒绝扫描或查询判 nok，仅缺少核验结果证据且无独立错误判 others。
    - query 表述简短或存在多种合理意图时，如果 agent 能明确指出需要用户补充的具体信息并发起可执行的澄清，按 no_support / 待用户澄清处理；未作必要澄清却擅自作答、给出无法对应原意的答案时，判 nok / 任务结果错误，不能以任务意图不明确转 others。只有输入本身损坏或无法形成可执行澄清时，才使用 others / 任务意图不明确；输入要求矛盾按任务要求矛盾处理。
  low_level_rules:
    - 只有意图清晰的简单任务被判 nok，且不存在客观阻塞并发生明显可归责的基础执行错误时，才输出 yes。
    - ok、no_support、others 以及复杂多任务固定输出 no；不要仅因结果是 nok 就自动输出 yes。
rubrics:
  - name: 操作完成度
    description: 基于整个 query 判断生效目标和最终文字回复是否完整闭环。
    weight: 0.7
    scale: 5
    criteria:
      - 所有生效目标是否达到各自验收终点并有足够依据；不对适用先验的交付追加正文验证
      - 是否仍需要用户继续操作
      - 条件任务是否判断并执行了正确分支
      - agent 自述是否与画面一致
      - 最终文字回复是否完成 query 要求、清晰传达结果且与画面一致
      - 幂等状态设置的初始状态是否已经满足用户要求；动作指令是否存在必要的活动对象
      - 是否存在助手无法自主补齐的客观阻塞
    score_anchors:
      5: 整个 query 的所有生效目标完整闭环，或幂等状态设置的初始状态已经满足；最终状态有充分证据支持；通用回复或展示质量问题不单独降低 correctness
      4: 所有生效目标已完成，但最终结果存在不影响闭环确认的轻微瑕疵
      3: 已完成主要结果，但仍有应执行目标未执行、任务结果错误、执行中断，或缺少能够验证结果的状态证据
      2: 只完成少量结果或中间过程，最终目标明显未闭环
      1: 未执行、最终状态错误、执行相反操作，或只有文字声明而没有任何实际完成证据
  - name: 步骤正确性
    description: 基于整个操作过程判断实际操作路径是否正确、连贯且合理。
    weight: 0.3
    scale: 5
    criteria:
      - 是否发生与 query 相关的实际操作；只按可见过程评分，无法判断的维度填null，不由过程未完整展示推断步骤错误
      - 操作路径是否正确且未缺失关键步骤
      - 是否出现走错、卡住、反复尝试、冗余或无关步骤
      - 合法替代路径、系统自动跳转和关键帧之间缺失的过渡画面不应被判为冗余
      - 只评价当前 query 发出后到任务闭环前的操作，忽略之前的历史内容和完成后的无关行为
    score_anchors:
      5: 当前任务有效时间窗内的实际路径正确、连贯，没有可观察到的冗余、无关或错误步骤
      4: 存在少量冗余、重复点击或无关步骤，但不影响最终结果，可以接受
      3: 存在明显绕路或多次重试，但整体方向正确
      2: 多次走错路径或操作混乱，只完成少量相关过程
      1: 路径完全错误、南辕北辙，或没有发生与 query 相关的实际操作
