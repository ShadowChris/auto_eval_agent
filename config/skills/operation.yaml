name: operation
display: 任务类
matching_categories: []
rules: "任务类（录屏）评测：看录屏关键帧判断操作是否完成意图。务必区分「真的执行」与「只给口头指导/教程而未执行」。"
operation_policy:
  route_policy:
    routes:
      fast_system:
        name: 快系统
        description: 任务由系统级快捷能力直接处理，不展示结构化执行步骤，也不进入可视化代理操控流程。
        positive_cues:
          - 直接弹出与 query 对应的系统设置卡、状态卡、控制组件或结果，并很快返回结果。
          - 整段过程中未出现 skill 步骤信息栏或贾维斯操控任务卡，同时存在实际任务执行或状态结果证据。
        exclusions:
          - 仅因没有步骤信息不能判为快系统；纯文本问答、联网检索或无任务执行证据不属于快系统。
          - 任一关键帧已经出现独立的 skill step info 或贾维斯操控卡时，同一结果卡不能再单独证明快系统；只有观察到另一次独立的快系统尝试时才可多标签。
      skill:
        name: skill
        description: 任务通过技能或工具编排链路执行，界面展示结构化步骤信息、技能执行状态或可展开的过程栏。
        positive_cues:
          - 加载或执行过程中出现技能名、步骤名、函数、工具或任务流程等系统格式的 step info。
          - 结束后出现带步骤数量或可展开过程信息的“✓ 已完成”栏，或同类结构化流程状态栏。
        exclusions:
          - 普通回答文本中偶然提到“技能”、工具或助手名称不算；“相关工具已返回结果”等普通回答也不算 step info。
          - 贾维斯操控任务卡内部或紧邻其下方的“应用操作”过程文字属于贾维斯操控过程，不能仅凭该文字额外标记 skill。
          - 孤立且无步骤栏结构的“已完成”只能作为弱证据；skill 至少需要独立的执行/调用 step info、步骤数量/齿轮栏或可展开完成栏之一。
      jarvis:
        name: 贾维斯
        description: 任务进入可视化自主操控链路，由代理在应用或系统界面中连续执行操作。
        positive_cues:
          - 出现“思考中/任务执行中”“正在操作设置”等操控任务卡，以及查看、停止或接管控件。
          - 出现彩色操控边框，或结束时出现“已结束操控，点击查看”等明确操控流程标识。
        exclusions:
          - 单纯打开设置或应用页面、普通加载动画、孤立的查看按钮均不能单独证明贾维斯链路。
      other:
        name: 其他
        description: 明确观察到不属于快系统、skill、贾维斯的处理链路，包括 QA、检索生成、纯文本回答或其他新形态。
        positive_cues:
          - 出现“生成回复”“参考 N 篇资料”、引用来源、联网检索等问答或检索生成界面元素。
          - 整段录屏没有快系统结果卡、skill 步骤信息或贾维斯操控卡，最终只以普通文字回复或问答卡片交付时，归为其他。
          - 进入以“某某助手”为标题的普通对话型子页面，仅展示聊天气泡、工具返回文本或回答，没有独立 step info、可展开完成栏或贾维斯操控卡。
        exclusions:
          - 其他不是无法判断的兜底类型；关键帧不足、界面模糊或没有任何链路证据时应标记 insufficient_evidence。
          - 已经识别到快系统、skill 或贾维斯后，后续普通结果回复、总结、聊天气泡或普通对话页面只是已有链路的交付内容，不能额外标记 other；只有后续出现“生成回复”“参考 N 篇资料”、引用来源、联网检索等独立 QA/检索生成流程时，才可追加 other。
    rules:
      - 链路识别是独立的观察字段，不得根据链路类型推断任务成功或失败，也不得影响 correctness、issue_types、维度分和 is_low_level。
      - execution_routes 是多标签数组，按各链路视觉证据第一次出现的时间排序，同一种链路多次出现只保留一次。
      - 流程失败后切换到另一链路时，失败链路和后续链路都要保留；无法区分同帧内先后时按 fast_system、skill、jarvis、other 的固定顺序输出。
      - 系统格式的 step info 是 skill 识别证据；只有无必要的内部过程内容进入面向用户的 answer 时，才属于“内部过程信息泄露”。
      - “✓ 已完成”“已结束操控”等流程标识可作为链路证据，但不能单独证明用户任务完成。
      - 没有足够视觉证据时 execution_routes 输出空数组、route_status 输出 insufficient_evidence，不得自动归为 other。
      - 同一视觉元素只能支持一种最符合其 UI 载体的链路，不能把 skill 或贾维斯产出的结果卡再次当成快系统；只有不同时段出现彼此独立的强特征时才输出多标签。
      - 页面或会话标题中的“助手”名称只表示进入了某个对话子页面，不等同于 skill；例如只有“相关工具已返回结果”等普通气泡文本、没有独立步骤栏时应归 other。
      - skill 与贾维斯同时出现时，只有前后帧存在独立的具体技能/工具调用、step info 或完成栏，才保留 skill；仅有紧邻贾维斯卡片的“任务执行中/应用操作”泛化文字时只标记 jarvis。
      - 普通文字回复作为整段录屏唯一可观察到的处理形态时归为 other；普通文字如果只是快系统、skill 或贾维斯的最终回复，不构成新的链路。只有在不同时段观察到独立的 QA/检索生成强特征时，才能与操作链路并列输出 other。
  scope_rules:
    - 在评价任务执行前，必须先核验录屏中展示的原始用户 Query 能否与评测输入 Query 一致对应。只忽略空格、换行、标点等展示格式差异，不进行同义改写推断。任务执行面板中的规划、步骤文案、工具调用文字和 agent 回复都不能代替原始用户 Query。
    - 基于整个 query 评估，不要拆成多个独立 case。
    - 简单任务只有一个可独立验收的最终结果；复杂多任务包含多个可独立验收的结果。判断依据是结果数量，不是点击次数。多个结果不等于彼此独立：如果多个目标共享同一个必须由用户补充的对象、身份、搜索关键词、候选选择、预订偏好或凭据，这些目标依赖同一阻塞；只有不依赖该信息也能继续闭环的目标才算独立目标。
    - 不得擅自扩大 query 的完成边界。只有功能、页面或对象名称而没有“开启、关闭、设置”等动作要求时，可以按打开、查看或展示该功能入口理解；如果存在多种合理意图且 agent 明确询问用户要查看、开启还是设置，应按待用户澄清判断，不因 query 简短而直接归 others。已经到达 query 所要求的对应页面或展示目标状态时，不得额外要求启用功能、完成协议授权或修改状态。
    - 区分幂等状态设置和依赖活动对象的动作指令：关闭定位、开启蓝牙、设为静音等状态设置在当前状态已经符合要求时可以直接完成；停止播放、暂停下载、挂断电话、取消导航等动作必须存在正在运行的媒体、下载、通话或导航对象，活动对象不存在时不能按“初始状态已满足”处理。
    - 同时要求前置判断结果和条件成立后的执行动作时，包含两个可独立验收的结果，按复杂多任务处理。
    - 只评价从当前 query 首次发出或开始执行，到任务闭环、失败或录屏结束之间的行为；忽略此前历史内容和完成后的复制、滚动、返回或新任务，除非它改变或撤销目标状态。
  query_image_rules:
    - 用户输入图片与文字 Query 共同构成原始任务条件，可用于理解目标对象、待处理内容和操作参数；不得只看文字而忽略图片指代的信息。
    - 用户输入图片是任务输入，不是 Agent 的操作过程或完成结果，不能单独作为任务完成证据；完成情况仍需由录屏关键帧和 Agent 自述交叉判断。
    - evidence_frames 和 route_evidence.evidence_frames 只引用录屏关键帧序号，不包含用户输入图片；用户图片与录屏帧必须按提示中的角色和编号分别理解。
    - Agent 对图片中的对象、文字、地址或内容理解错误，并因此操作了错误对象或产生错误结果时，沿用任务结果错误、其他执行问题等现有 issue type，不新增图片专属 correctness。
    - 用户图片文件缺失、损坏或无法解析属于评测输入错误，应在模型评估前失败；图片可以读取但其内容不足以提供完成任务所必需的信息时，才按实际情况考虑 no_support / 缺少前置条件。
  evidence_rules:
    - 录屏中的原始用户 Query 与评测输入 Query 内容不一致，或者原始用户 Query 未展示、展示不完整、被遮挡、模糊或无法辨认，导致无法完成一致性核验时，直接判 others，标记录屏Query无法与输入Query一致核验，所有评分维度和总分填 null，不再评价 agent 对当前输入 Query 的执行结果。仅空格、换行、标点等展示格式差异不触发；原始用户 Query 可以核对一致但后续执行偏离时，应继续按 nok 等正常规则评价。
    - 必须同时检查按时间顺序的视觉证据和 agent 文本自述，把二者作为互补证据联合判断；不得只依据其中一路下结论。等待用户的明确指引可以出现在界面、弹窗、任务执行过程文字或 agent 最终回答中，不要求视觉和文本重复出现同一句指引；任一路出现明确指引且没有相反证据时，都必须纳入最后有效状态。
    - 证据是否充分取决于其展示的具体内容，而不是所在载体；卡片、按钮、设置页面、系统状态、任务执行过程和结果页面都可以用于判断。
    - 画面明确展示目标对象及其结果状态，并且与 query 一致、没有相反证据时，即可作为完成依据；例如设置结果卡片直接显示目标开关状态或当前值，无需再次进入完整设置页面。
    - 多条证据可以共同证明同一生效目标；具体执行动作或参数、完成状态、结果卡片和 agent 回复相互一致时，可以形成充分的完成证据链。复杂多任务的每个生效目标都必须有对应证据，一个目标的证据不能替代其他目标。
    - 缺少反证不等于存在完成证据；不得因其他目标执行成功、系统具备操作能力或 agent 声称无报错，就推定未展示结果的目标已经完成。
    - 只有泛化的“正在操作/已完成”、工具名称、目标入口、操作轨迹或 agent 文字自述，而没有反映所有生效目标的具体结果状态时，只能证明尝试；如果模型收到的画面不足以验证结果、且没有观察到独立的漏执行、结果错误或执行中断证据，判 others，并标记未展示可验证结果，不得推测是否由抽帧遗漏造成。
    - 对包含不可省略的核心提交或触发动作的目标，例如播放、发送、发布、拨号、创建或分享，必须区分前置准备和核心动作执行。进入对应应用、跳转目标页面、找到目标对象、展示详情卡或动作按钮、泛化显示“正在操作某应用/已完成”，都只证明完成了前置准备，不能证明核心动作已经执行；录屏结束时仍停在这些准备状态，且没有客观阻塞或等待用户证据时，判 nok / 应执行目标未执行。只有观察到该目标专属的直接触发、执行中或执行完成反馈后，因后续画面缺失而无法确认最终状态时，才可以判 others / 未展示可验证结果。
    - 不要求展示状态变化前后对比；对于幂等状态设置，最终画面或初始状态直接满足 query 即可。对于依赖活动对象的动作指令，必须先有可操作对象；对象不存在属于缺少前置条件。关键帧未展示全部过渡过程不等于步骤错误，只根据实际观察到的走错、遗漏、重复、冗余或结果冲突扣分。
    - 任务执行窗口始终处于带“查看/点击查看”入口的缩略状态，导致过程和结果均不可见，且没有其他证据可供判断时，判 others，优先标记任务执行窗口未展开，相关评分维度填 null；窗口曾展开或其他画面已展示结果时，按正常证据判断。
    - 查询、导航、搜索、日程、天气、攻略、推荐、作文和摘要等结果以文字或卡片呈现时，可以作为最终结果；不主动进行外部事实核验，但必须检查是否完成 query 要求、是否遗漏必要内容，以及是否与录屏、结果卡、上下文或可信先验存在明确冲突。
    - 区分“查询结果为空”和“动作缺少目标对象”。query 只要求查询、搜索、查看或核对时，agent 采用合理路径后如实展示“未找到、无记录、暂无结果”可以完成查询目标；query 要求恢复、删除、分享、粘贴、停止、挂断等实际动作时，系统显示没有可恢复应用、目标文件、剪贴板内容或活动对象，说明动作目标缺失，应判 no_support，不能因为成功进入页面或展示空状态就判 ok。
    - 当前画面只展示列表的一部分，或某一帧没有出现 query 指定对象，不足以证明该对象客观不存在。只有完整搜索后明确显示无结果、穷尽性列表能够覆盖目标范围，或可信专家经验直接确认缺失时，才能把目标对象缺失判为 no_support；否则应按实际执行路径、最终反馈和结果证据判断。
    - 后续更直接的系统状态与卡片或回复冲突时，以更直接的状态为准；仍无法确定时判 others，并标记评测证据冲突。
    - 对未完成目标必须识别其最后有效状态。界面、任务执行过程文字或 agent 最终回答明确提示用户登录、授权、验证、补充必要信息、作出必要选择或确认时，属于等待用户。“无法继续”“请自行操作”“相关工具已返回结果”等未说明具体缺失条件、能力限制或用户下一步动作的泛化终止语，不足以证明等待用户或能力不支持；没有任何用户指引、最终回答为空且流程停止或超时，属于静默停滞。
    - 固定失败文案必须按完整语义映射，不能只抓“无法”“问题”或“结果”等关键词：agent 回复“无法为你继续操作了”表示本次操控执行失败，未说明临时异常、客观阻塞或用户下一步，判 nok / 执行中断；“小艺算力不够了，请稍后再试”表示资源不足，“遇到一点小问题，请稍后再试”表示临时服务异常，在此前没有独立可归责错误时均判 others / 环境或算力异常；系统或 agent 明确反馈“无验证结果”，以及裁判根据现有画面只能确认“未展示可验证结果”，在没有独立可归责错误时均判 others / 未展示可验证结果。
    - 第三方应用登录、授权或身份验证场景中，录屏停在相关页面，并且界面、任务执行文字或 agent 最终反馈明确要求用户登录、确认、接管，或者明确反馈本次任务已因等待而超时、终止时，可以判 no_support。只有同时满足以下条件时才判 nok / 三方应用跳转中断：仅停在普通登录入口或登录页面；界面、任务执行文字和 agent 均无任何澄清或用户操作提示；agent 最终回答为空；没有因等待用户而超时或终止的反馈；流程静默停止。回复非空不自动等于 no_support，仍需检查其是否包含与继续任务直接相关的明确指引。
    - agent 发起与任务闭环直接相关、且用户必须回答的明确询问时，按实际等待用户状态判断；不要求 agent 在询问前先打开应用或执行不依赖参数的表面步骤。自动接听、日程、联系人或地址、机票酒店门票等任务确实缺少生效对象、时间、姓名地址、候选项或预订偏好时，可以在实际操作前先澄清。多个目标共享同一对象、搜索词、候选选择或预订偏好时，该次澄清可以同时阻塞这些依赖目标。
    - 合理搜索未找到 query 指定对象后，询问用户修改关键词、补充对象或放宽条件属于必要澄清。反之，query 已提供继续执行所需信息时，agent 因理解错误、采用不相关关键词、未找到正确入口、工具或技能失败而询问用户是否换路径、换入口、继续查找、手动处理或上报，只是错误后的恢复询问，不能把此前可见错误改写为等待用户。必要澄清必须补齐原任务缺少的信息、对象或选择，或者取得助手无法代替用户作出的登录、授权、下单确认；用户不负责选择 agent 的搜索、导航、工具或补救策略。诸如“需要我继续到设置中查找吗”“换关键词、换入口还是上报”均属于执行策略询问，不是必要澄清。专家经验已确认能力或页面存在时，未找到入口后再询问其他路径仍属于执行失败，除非另有真实外部条件阻塞。
    - 早先出现过用户指引，只有用户已经实际答复、选择、确认、完成登录或授权，或者后续画面已经越过该登录、授权、确认页面并进入应用内容、搜索结果、商品详情或其他后续执行页面时，才视为解除；解除只说明旧阻塞不再有效，不代表后续执行正确。解除后必须从新的最后有效状态重新判断剩余目标，不能继续用早先的指引解释后续未完成。仅返回桌面、助手界面或其他无法证明越过阻塞的页面，不算解除。若 agent 未等用户答复便自行继续，则需检查该询问是否本来就不必要，不能再用它解释后续未完成。
    - 判 no_support 前必须给出完整的阻塞资格：明确需要用户完成的具体动作或补充内容；说明它为何是继续原任务不可替代的条件，而不是让用户选择 agent 的执行策略；证明该条件在最后有效状态仍未解除；确认此前不存在足以独立导致失败的可归责错误。任一项不能成立时，不得仅因出现过询问、登录页或“手动操作”字样判 no_support。
    - 复杂任务按实际串行执行链判断。agent 沿合理流程执行到当前步骤后进入真实、必要且仍有效的待澄清，并因此停止整条任务流时，后续尚未开始的目标属于串行中断后果，不单独标记应执行目标未执行，即使这些目标在逻辑上不依赖同一信息。只有阻塞前已经发生可见执行错误、已有目标声称完成但无证据，或录屏明确显示任务仍在继续执行后续目标时，才单独评价这些目标。
    - 目标已有效进入等待用户状态时，缺少用户后续操作和最终结果只是阻塞的必然后果，不能再为同一目标标记应执行目标未执行、执行中断或未展示可验证结果。
  correctness:
    ok: 简单任务唯一生效目标完成，或复杂多任务所有生效目标完成，无需用户继续操作；幂等状态设置的初始状态已经满足也属于完成。停止播放、暂停下载、挂断电话、取消导航等依赖活动对象的动作在对象不存在时不属于初始状态已满足。条件任务正确获得前置信息且正确执行实际分支，条件不成立时正确跳过后续目标也属于完成。内部过程信息泄露、回复语义重复、重复系统卡片及不影响结果的轻微过程问题只记录 issue_types，不直接改变 correctness。
    nok: 存在影响任务结果或闭环的可归责错误，包括已生效且具备执行条件的目标或必要动作未执行、任务结果与 query 不一致、无明确系统异常或有效用户交互却停止或卡住、三方应用跳转后静默中断，或回复与可见界面冲突。仅仅未展示可验证结果不属于可归责执行错误，应判 others；只有同时观察到独立的漏执行、结果错误、执行中断或回复冲突时，才由该独立错误判 nok。回复“无法为你继续操作了”只表示操控执行失败，未提供临时异常、客观阻塞或用户下一步，属于 nok / 执行中断。回复内部矛盾只有在影响最终结果理解或内容交付时才判 nok。已观察到的结果性执行错误优先于后续的临时异常或能力不支持声明，也优先于错误发生后的恢复性询问；理解成错误任务、采用明显不相关的入口、query 信息充分却重复询问，以及先发生可见错误后再询问用户换路径，都不能被后续询问洗成 no_support。可信专家经验确认当前能力受支持，且不存在必须由用户补充的权限、登录、密码、个人信息或其他外部条件时，agent 拒绝执行或错误声称不支持，属于可归责执行错误。
    no_support: 不存在影响任务结果的可归责执行错误，但因助手无法自主补齐的外部条件无法闭环。包括两类：一是界面、任务执行过程文字或 agent 最终回答明确提示用户登录、授权、身份验证、补充必要信息、作出继续任务所必需的选择或确认，任务正在等待用户接管；二是缺少完成任务所需的图片、文本内容、应用、目标对象、硬件、设备能力或活动会话，或 agent 明确说明助手、设备或系统不支持完成该类任务，且没有可信专家经验或可见证据反驳。可信专家经验已经确认当前能力受支持时，不能仅依据 agent 的不支持声明判 no_support，仍需检查是否存在真实的外部前置条件；反过来，没有相关专家经验或同一目标的可见成功证据时，也不得用“通常可以通过其他网络、应用、入口或方法完成”的泛化常识反驳明确的不支持声明。agent 明确说明缺少完成任务所需的信息并指引用户提供时，属于缺少前置条件；“无法继续”“请自行操作”等泛化终止语本身不属于明确能力不支持或前置条件说明。不得仅因任务尚未完成而判 nok。第三方登录、授权或身份验证页面与明确用户接管指引，或者与“因等待而超时/终止”的最终反馈共同出现且录屏结束时仍未解除时，可以判 no_support；后续画面已经越过阻塞页并进入应用内容、搜索结果或商品详情时，早先阻塞已经解除，必须评价后续执行。只有普通登录入口或登录页面、三路证据均无澄清提示、agent 最终回答为空、没有等待反馈且流程静默停止时才判 nok。当前界面或专家经验已经直接证明 SIM 卡、必要应用、活动对象等客观前置条件缺失时，可以据此判 no_support，不强制要求 agent 再重复说明；但该条件必须能够直接解释本次未完成，不能覆盖已经发生的错误路径、无关操作或执行失败。未解释原因只作为回复体验问题，不单独改判 nok。
    others: 不存在优先级更高的可归责执行错误，且因现有证据不足、临时系统或评测输入异常而无法完成或可靠判断。包括目标已经尝试或 agent 声称完成、但模型收到的画面未展示可验证结果；agent 明确说明“小艺算力不够了，请稍后再试”“遇到一点小问题，请稍后再试”等资源或服务临时异常；系统或 agent 明确反馈“无验证结果”；外部服务暂时异常；以及 query、视频、输入数据或界面呈现异常。不得把已经观察到的漏执行、结果错误、执行中断或回复冲突降级为 others。
  issue_types:
    内部过程信息泄露:
      allowed_correctness: [ok, nok, no_support, others]
      description: agent 回复暴露无必要的内部推理、检索过程、skill、工具名称或调用过程；例如“我先想想任务规划”“加载某技能”“没有匹配的技能”“调用某工具/接口”等面向内部执行的文字。该问题默认不直接改变 correctness，即使后续任务已经闭环也必须记录。
    回复语义重复:
      allowed_correctness: [ok, nok, no_support, others]
      description: agent 回复前后重复表达相同含义；该问题默认不直接改变 correctness。
    回复内容自相矛盾:
      allowed_correctness: [ok, nok, no_support, others]
      description: agent 回复内部出现相互冲突的描述；只有矛盾影响最终结果理解或内容交付时才判 nok。
    重复系统卡片:
      allowed_correctness: [ok, nok, no_support, others]
      description: 同一任务出现内容相同或高度重复的系统结果卡；只有重复执行产生错误结果或副作用时才影响 correctness。
    重复操作:
      allowed_correctness: [ok]
      description: 存在不影响最终结果的重复点击或重复执行。
    路径冗余:
      allowed_correctness: [ok]
      description: 操作路径存在绕路，但最终结果正确闭环。
    轻微无关步骤:
      allowed_correctness: [ok]
      description: 存在少量无关步骤，但不影响最终结果。
    其他轻微问题:
      allowed_correctness: [ok]
      description: 任务正确闭环，但存在其他不影响 correctness 的轻微问题。
    应执行目标未执行:
      allowed_correctness: [nok]
      description: Query 直接要求或条件成立后已经生效，且具备执行条件的任务目标或必要动作没有开始执行；包括停在本可继续完成的最后一步，以及动作型 query 只完成了进入应用、跳转页面、前置查询、内容定位、展示详情卡或动作按钮等准备步骤，没有出现目标专属的核心提交或触发证据。要求播放却仅停在搜索结果卡、详情卡、播放按钮、普通应用跳转或模糊的应用加载画面，均属于播放目标未执行。不包括条件未触发、因明确前置条件缺失而无法执行，或界面、最终回答已经明确等待用户操作的目标。rationale 必须指出具体目标。
    任务结果错误:
      allowed_correctness: [nok]
      description: 已经执行或交付结果，但最终结果与 query、可见证据或已知条件不一致；不得因无法外部核验文字事实而使用该类型。
    执行中断:
      allowed_correctness: [nok]
      description: 没有明确的临时系统异常，界面和 agent 最终回答也没有用户操作指引，普通任务执行过程停止、卡住、静默超时或异常循环未结束。
    三方应用跳转中断:
      allowed_correctness: [nok]
      description: 跳转到第三方应用后未进入正确目标流程，或停在普通登录入口、登录页、首页等中间状态，且界面、任务执行文字和 agent 均无澄清或用户操作提示、agent 最终回答为空、没有等待反馈并静默停止；能够使用该类型时，不再同时输出普通执行中断。登录、授权或确认界面存在明确指引时，按缺少前置条件判断。
    未展示可验证结果:
      allowed_correctness: [nok, others]
      description: 有证据表明对应目标已经尝试执行，或 agent 明确声称该目标已经完成，但模型收到的画面没有展示能够验证完成的具体结果状态；该问题本身主判 others。复杂任务同时存在其他独立可归责错误、整体因此判 nok 时，本类型可作为次要问题。不得推测是否由抽帧遗漏造成。目标根本没有开始执行时应使用应执行目标未执行；已观察到错误结果时使用任务结果错误；目标已明确等待用户操作时，缺少最终结果是阻塞后果，不使用本类型。
    回复与界面不一致:
      allowed_correctness: [nok]
      description: agent 面向用户的自然语言回复对任务最终结果的描述与录屏中的可见界面状态明确冲突。系统任务窗口中的步骤文案、勾选标记、“√已完成”“超时，任务终止”等流程状态不属于 agent 回复，不能据此使用本类型；必须先指出发生冲突的具体自然语言回复，否则不得标记。
    其他执行问题:
      allowed_correctness: [nok]
      description: 已确认存在影响结果的可归责执行错误，但现有 nok 类型无法覆盖。
    待用户澄清:
      allowed_correctness: [nok, no_support]
      description: 为继续完成原始任务，界面、任务执行过程文字或 agent 最终回答已向用户发起明确询问，并且确实缺少用户必须补充的信息、对象、选择或确认；即使前置查询、搜索、导航到目标页或内容准备等步骤已经正确完成，只要原始任务仍需用户答复后才能继续，仍属于待用户澄清；也不要求询问前先打开应用或执行表面步骤。自动接听、日程、联系人或地址、机票酒店门票等任务确实缺少必要参数或候选选择时，可以先澄清。多个目标共享同一对象、搜索词、候选选择或预订偏好时，该澄清可同时阻塞这些依赖目标。合理搜索未找到 query 指定对象后，询问修改关键词、补充对象或放宽条件也属于必要澄清，除非搜索对象、关键词或路径本身错误。query 已经明确给出所需信息时，重复确认用户原意，或在理解错误、错误应用、不相关关键词、错误路径、未找到正确入口、工具或技能失败后询问是否换路径、换入口、继续查找或上报，不是必要澄清，不能覆盖此前的可归责错误。复杂任务整体因其他真正独立目标错误判 nok 时可作为次要问题。
    缺少前置条件:
      allowed_correctness: [nok, no_support]
      description: 缺少图片、待处理文本或内容、应用、登录、权限、身份验证、目标对象、硬件、设备能力或助手能力等无法自主补齐的条件；agent 明确说明缺少完成任务所需的信息并指引用户提供时也属于本类型。登录、授权和身份验证场景需要界面、任务执行过程文字或 agent 最终回答包含明确用户操作指引，并且该阻塞由正确任务路径触发、结束时仍有效。也包括停止播放、暂停下载、挂断电话、取消导航等动作缺少正在运行的目标对象或会话，以及 agent 明确声明能力不支持且没有可信反证的情况。可信反证只能来自专家经验或当前可见的同一目标成功证据，不能用泛化能力常识、相似能力或裁判设想的替代策略反驳，也不能以通常可用的其他网络、应用或入口作为反证；专家经验已确认能力受支持且没有真实外部前置条件时，不使用本类型。当前界面或专家经验已直接证明客观前置条件缺失时，不要求 agent 再重复说明。复杂任务整体因其他独立目标错误判 nok 时可作为次要问题。
    其他阻塞原因:
      allowed_correctness: [nok, no_support]
      description: 已确认不存在当前目标的可归责执行错误且受到客观条件阻塞，但不属于待用户澄清或缺少前置条件。
    环境或算力异常:
      allowed_correctness: [nok, others]
      description: agent 明确说明算力不足、系统繁忙、遇到临时问题或稍后重试；包括“小艺算力不够了，请稍后再试”和“遇到一点小问题，请稍后再试”。复杂任务整体因其他目标错误判 nok 时可作为次要问题。
    外部服务暂时异常:
      allowed_correctness: [nok, others]
      description: 外部服务临时不可用，重试后可能恢复；稳定的能力不支持应使用缺少前置条件。
    视频损坏:
      allowed_correctness: [others]
      description: 输入视频内容明确损坏，无法用于评测。
    录屏数据不完整:
      allowed_correctness: [others]
      description: 输入的录屏数据本身明确不完整；不得根据关键帧中没有某状态而推测抽帧遗漏。
    视频无法解析:
      allowed_correctness: [others]
      description: 输入视频无法被系统正常解析。
    任务意图不明确:
      allowed_correctness: [others]
      description: Query 无法确定具体任务意图。
    任务要求矛盾:
      allowed_correctness: [others]
      description: Query 内部要求互相矛盾，无法确定可执行目标。
    输入数据异常:
      allowed_correctness: [others]
      description: Query、上下文、媒体路径或其他评测输入存在异常。
    录屏Query无法与输入Query一致核验:
      allowed_correctness: [others]
      description: 录屏中的原始用户 Query 与评测输入 Query 内容不一致，或原始用户 Query 未展示、展示不完整、被遮挡、模糊、无法辨认，导致无法确认二者对应。只忽略空格、换行、标点等格式差异；不得用任务执行面板的规划或步骤文案、工具调用文字、agent 回复代替原始用户 Query。
    任务执行窗口未展开:
      allowed_correctness: [others]
      description: 任务执行窗口始终处于缩略状态，过程和结果均不可见，且没有其他证据可供判断。
    评测证据冲突:
      allowed_correctness: [others]
      description: 多项可见证据互相冲突，无法可靠判断最终状态。
    未预期场景:
      allowed_correctness: [others]
      description: 出现现有 correctness 和 issue type 未预期覆盖的评测场景。
    其他未归类情况:
      allowed_correctness: [others]
      description: 已确认应判 others，但现有类型无法覆盖。
  decision_order:
    - 首先执行录屏与输入 Query 一致性门禁：只读取录屏中明确属于原始用户指令的文字，不得使用任务执行面板的规划或步骤、工具调用文字、agent 回复代替。若录屏原始用户 Query 与输入 Query 内容不一致，或未展示完整、被遮挡、模糊、无法辨认而不能完成一致性核验，直接判 others / 录屏Query无法与输入Query一致核验，所有维度和总分填 null，停止后续任务执行评判。只忽略空格、换行、标点等展示格式差异，不进行同义改写推断。
    - 先核对与当前任务直接相关的专家经验：能力范围以专家经验为准，本次执行状态以录屏直接证据为准。专家经验确认能力受支持且没有真实外部前置条件时，agent 的“不支持”声明不能作为 no_support 依据；专家经验说明能力受支持也不能代替本次任务的完成证据。
    - 再检查固定失败文案：“无法为你继续操作了”映射为 nok / 执行中断；“小艺算力不够了，请稍后再试”和“遇到一点小问题，请稍后再试”映射为 others / 环境或算力异常；“无验证结果”映射为 others / 未展示可验证结果。若此前已有足以独立决定结果的可归责错误，仍由该错误优先决定整体 correctness。
    - 先按 query 原文锁定完成边界，不得自行增加动作。只有功能、页面或对象名称时，可以按打开、查看或展示入口理解；存在多种合理意图且 agent 明确询问用户要查看、开启还是设置时，归待用户澄清，不得直接归 others。已经到达 query 要求的目标页面时，不得因未启用功能、未同意协议或未修改设置而判未完成，除非 query 明确要求这些动作。
    - 在给出 correctness 前必须先完成“阻塞证据门控”，不可跳过：①逐帧扫描并逐字摘录面向用户的登录、授权、同意、验证、补充、选择、确认等清晰可辨文字，注明来自哪个画面；协议说明配合“取消/同意”等按钮也属于明确指引；②从完整 agent 文本中逐字摘录“无法/缺少/未提供/请提供/请选择/是否/要不要/请确认”等与继续任务直接相关的原文；③标明每条文字属于界面用户指引、任务面板流程状态还是 agent 自然语言回复；④检查阻塞发生前是否已经存在与用户未响应无关、并会独立导致任务失败的可见错误。只有能够逐字引用的完整句子或协议提示才算明确指引；普通“登录”入口、“查看”按钮、“手动操作中”状态、接管或停止控件、加载动画和流程“已完成”均不算。流程“超时/终止”通常只表示结果，但在录屏仍停留于登录、授权或身份验证页面时，可以与该页面和最终反馈共同证明任务因等待用户而结束。“无法继续”“请自行操作”“相关工具已返回结果”等泛化终止语只有在同时说明具体能力限制、缺失条件或用户下一步动作时，才能作为阻塞证据。
    - 阻塞证据门控的映射是强约束。判 no_support 前必须逐项写明：①用户必须补充的信息或完成的具体动作；②该动作为何是继续原任务不可替代的外部条件，而不是让用户选择 agent 的搜索、导航、工具或补救策略；③最后有效状态中阻塞是否仍未解除；④阻塞前是否已有足以独立导致失败的可归责错误。只有前 3 项成立且第 4 项为否，才允许判 no_support。“需要我继续到设置中查找吗”“换关键词、换入口还是上报”等都是执行策略询问，不是必要澄清。后续画面进入应用内容、搜索结果、商品详情或其他阻塞后的执行页面时，旧阻塞立即视为解除；解除后重新评价剩余目标，即使后续执行错误或不完整。仅返回桌面或助手界面不算解除。
    - 先确定当前 query 的有效时间窗、任务形态、条件、目标依赖关系、实际生效目标及原始任务的完成边界。查询、搜索或展示候选结果只有在 query 本身要求查询、搜索、推荐或列举时才可作为完成；query 要求预订、下单、发送、发布等实际动作时，前置查询结果只是执行过程，agent 随后询问用户选择、补充或确认，说明原始任务尚在等待用户，不能提前判 ok。
    - 按时间顺序分别通读全部视觉证据和完整 agent 文本自述，再合并两路证据判断；不得因最终一帧返回桌面或助手界面而忽略此前出现的协议同意、授权、选择、确认或补充信息指引，也不得因文本为空而忽略界面中的明确指引。
    - 在检查回复冲突前，先区分 agent 面向用户的自然语言回复与任务执行面板的系统流程状态。任务面板中的步骤说明、勾选、“已完成”和“超时，任务终止”不能作为 agent 回复；同一面板明确要求用户确认或选择时，判定为等待用户，不能把步骤“已完成”与后续超时拼成回复矛盾。
    - 再判断指令属于幂等状态设置还是依赖活动对象的动作：状态设置当前已经符合要求可判完成；停止、暂停、继续、取消、挂断等动作没有对应活动对象，且 agent 正确说明情况时判 no_support，并标记缺少前置条件。
    - 对每个目标优先识别最直接根因：已完成、待用户澄清、缺少前置条件、临时环境异常、评测侧无法判断、应执行但未执行、执行中断或结果错误；同一个目标不要同时记录根因和其必然后果。
    - 对每个未完成目标确认最后有效状态。界面、任务执行过程文字或 agent 最终回答有明确的登录、授权、验证、补充、选择或确认指引时属于等待用户；没有任何用户指引、最终回答为空且流程停止或超时属于静默停滞。录屏停留在登录、授权或身份验证页面时，如果最终反馈明确要求用户接管，或者明确提示本次任务已经超时或终止，可判 no_support；仅有普通登录入口且没有任何反馈时判 nok。已经明确等待用户的目标，不得再因用户未响应造成的未执行、中断或无最终结果改判为执行错误。
    - 复杂多任务按实际串行执行链判断。agent 沿合理流程执行到当前步骤后进入真实、必要且仍有效的待澄清，并因此停止整条任务流时，后续尚未开始的目标属于串行中断后果，不单独标记遗漏，即使这些目标逻辑上不依赖同一信息。只有阻塞前已经发生可见错误、已有目标声称完成但无证据，或录屏明确显示任务在阻塞后仍继续执行其他目标时，才分别评价这些目标。
    - 对查询和动作分别验收：查询、搜索或核对采用合理路径后得到“未找到、无记录、暂无结果”，如实交付该空结果可以判查询目标完成；恢复、删除、分享、粘贴、停止、挂断等动作显示没有可恢复对象、目标文件、剪贴板内容或活动对象时，属于缺少前置条件，不能因到达页面或展示空状态判 ok。当前帧只显示部分列表或没有出现目标对象时，不得直接推断对象不存在。
    - 跳转第三方应用后，只有同时满足以下条件时才优先标记三方应用跳转中断：停在普通登录入口、登录页、首页或其他中间状态；界面、任务执行文字和 agent 均无澄清或用户操作提示；agent 最终回答为空；没有因等待用户而超时或终止的反馈；流程静默停止。登录或授权页面与明确接管指引、超时或终止反馈共同出现时，按缺少前置条件判断；回复非空但不包含相关指引时，仍按其实际内容和可见结果判断。
    - 严格区分“目标未执行”和“执行后缺少结果证据”：完全没有开始的独立目标使用应执行目标未执行并判 nok；已经尝试或明确声称完成、但无状态证据时使用未展示可验证结果，该问题本身判 others；同一目标不能同时使用两者。
    - 画面已经展示具体最终状态，但该状态与 query 要求不一致时，优先标记任务结果错误并判 nok；只有没有展示可判断对错的具体结果状态时，才使用未展示可验证结果并判 others。两者不能用于同一目标。
    - 对“播放、开始播放、打开并播放”等动作，搜索结果卡、影视详情卡、播放按钮、普通应用跳转、打开视频应用、模糊的应用加载画面或流程“已完成”都只能证明找到了内容或准备播放，不能证明播放动作已经发生。播放动作已经发起必须有播放专属的直接信号，例如可见触发“播放/立即播放”后紧接着出现播放载入、播放器页面或控件，界面明确显示“正在播放/播放中”，或者出现播放进度、暂停按钮等状态。没有这些信号时，说明必要播放动作未执行，判 nok / 应执行目标未执行；不能仅因画面跳转或模糊而降级为 others。只有已经观察到上述播放专属启动信号、但后续画面缺失而无法确认最终播放状态时，才判 others / 未展示可验证结果。
    - 任一目标存在影响结果的可归责错误时整体判 nok；Answer 后续声称临时异常或能力不支持不能覆盖已经观察到的执行错误。
    - 所有生效目标完成或正确跳过时判 ok；不存在可归责错误且所有未完成目标都被外部条件阻塞时判 no_support；仅因未展示可验证结果而无法确认完成时判 others；其余因临时系统、评测输入或未预期问题无法完成或判断时也判 others。
    - issue_types 第一项必须是决定整体 correctness 的主要原因；复杂任务可在后续项记录其他目标的不同根因，rationale 必须说明每项对应的目标。内部过程信息泄露、回复语义重复、回复内容自相矛盾和重复系统卡片等通用质量问题不能作为 nok、no_support、others 的第一项。
    - 确定 correctness 和主要根因后，必须再独立通读完整 agent 回复并检查四类通用质量问题：内部过程信息泄露、回复语义重复、回复内容自相矛盾、重复系统卡片；发现即追加到 issue_types，不得因 correctness 已确定而跳过。
  conditional_rules:
    - 只要求完成条件实际成立后所激活的目标；条件不成立时正确跳过后续动作，也属于完成。
    - 已获得前置信息但条件判断错误、条件成立却未执行后续动作，或条件不成立却错误执行后续动作，判 nok。
    - 因用户未提供必要信息而无法判断条件时判 no_support；因临时系统或外部服务异常无法获得条件信息时判 others；query 内部条件矛盾、无法确定生效分支时判 others。
    - query 表述简短或存在多种合理意图时，如果 agent 能明确指出需要用户补充的具体信息并发起可执行的澄清，按 no_support / 待用户澄清处理；只有输入本身矛盾、损坏或无法形成可执行澄清时，才使用 others / 任务意图不明确。
  low_level_rules:
    - 只有意图清晰的简单任务被判 nok，且不存在客观阻塞并发生明显可归责的基础执行错误时，才输出 yes。
    - ok、no_support、others 以及复杂多任务固定输出 no；不要仅因结果是 nok 就自动输出 yes。
rubrics:
  - name: 操作完成度
    description: 基于整个 query 判断生效目标和最终文字回复是否完整闭环。
    weight: 0.7
    scale: 5
    criteria:
      - 所有生效目标是否完成且最终状态可验证
      - 是否仍需要用户继续操作
      - 条件任务是否判断并执行了正确分支
      - agent 自述是否与画面一致
      - 最终文字回复是否完成 query 要求、清晰传达结果且与画面一致
      - 幂等状态设置的初始状态是否已经满足用户要求；动作指令是否存在必要的活动对象
      - 是否存在助手无法自主补齐的客观阻塞
    score_anchors:
      5: 整个 query 的所有生效目标完整闭环，或幂等状态设置的初始状态已经满足；最终状态有充分证据支持；通用回复或展示质量问题不单独降低 correctness
      4: 所有生效目标已完成，但最终结果存在不影响闭环确认的轻微瑕疵
      3: 已完成主要结果，但仍有应执行目标未执行、任务结果错误、执行中断，或缺少能够验证结果的状态证据
      2: 只完成少量结果或中间过程，最终目标明显未闭环
      1: 未执行、最终状态错误、执行相反操作，或只有文字声明而没有任何实际完成证据
  - name: 步骤正确性
    description: 基于整个操作过程判断实际操作路径是否正确、连贯且合理。
    weight: 0.3
    scale: 5
    criteria:
      - 是否发生与 query 相关的实际操作
      - 操作路径是否正确且未缺失关键步骤
      - 是否出现走错、卡住、反复尝试、冗余或无关步骤
      - 合法替代路径、系统自动跳转和关键帧之间缺失的过渡画面不应被判为冗余
      - 只评价当前 query 发出后到任务闭环前的操作，忽略之前的历史内容和完成后的无关行为
    score_anchors:
      5: 当前任务有效时间窗内的实际路径正确、连贯，没有可观察到的冗余、无关或错误步骤
      4: 存在少量冗余、重复点击或无关步骤，但不影响最终结果，可以接受
      3: 存在明显绕路或多次重试，但整体方向正确
      2: 多次走错路径或操作混乱，只完成少量相关过程
      1: 路径完全错误、南辕北辙，或没有发生与 query 相关的实际操作
