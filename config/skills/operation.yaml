name: operation
display: 任务类
matching_categories: []
rules: "任务类（录屏）评测：看录屏关键帧判断操作是否完成意图。务必区分「真的执行」与「只给口头指导/教程而未执行」。"
operation_policy:
  prior_knowledge:
    - 当前任务类录屏使用的评测手机未安装 SIM 卡；涉及拨打电话、发送短信或使用移动数据时，应将 SIM 卡缺失视为可信设备条件。
    - 正常情况下，任务执行窗口会自动展开并展示详细过程；出现“正在操作设置”“思考中”“任务执行中”“已结束操控，点击查看”等文字或“查看/点击查看”入口，表示窗口仍处于缩略状态，遮罩或模糊后台界面是正常产品表现。
    - 系统显示“√已完成”只表示本轮任务执行流程结束，不代表用户任务目标已经完成；不得仅凭该标识判为 ok，仍需结合具体结果状态、结果卡片和 agent 回复判断。该标识是系统流程状态，不是 agent 的自然语言回复；不得仅因它与实际任务结果不同而标记回复与界面不一致。
    - 任务执行面板中的步骤文案、勾选标记、“已完成”“超时，任务终止”等均属于系统流程状态，不属于 agent 面向用户的自然语言回复。步骤显示“已完成”只证明该步骤结束，不能证明整个 query 已完成，也不能用于标记回复与界面不一致或回复内容自相矛盾。同一面板另有“当前操作需要你的确认”“请明确告诉我你的选择”等用户操作指引时，应以该指引确定任务正在等待用户；随后出现的超时终止不改变这一根因。
    - 播客内容生成耗时较长；只要出现可识别的播客系统结果卡，即视为播客生成目标完成，即使卡片仍显示“生成中”或尚未自动播放。此时 agent 回复“播客已生成”“已经生成好了”表达的是结果卡已经成功创建，与卡片仍在生成具体音频内容不构成回复与界面不一致。只有泛化的生成中文字而没有播客结果卡时，不能判完成；卡片明确显示生成失败时也不能判完成。
    - 顶部红色录屏计时、录制胶囊、状态图标、触控提示和悬浮控件来自评测录屏工具，不是 agent 操作。
    - 对拍视频或录像任务，顶部状态栏或灵动岛的红点和计时不能证明相机正在录像；应以相机应用内部的停止或暂停按钮、独立录像计时，或图库中的新视频为准。
  scope_rules:
    - 基于整个 query 评估，不要拆成多个独立 case。
    - 简单任务只有一个可独立验收的最终结果；复杂多任务包含多个可独立验收的结果。判断依据是结果数量，不是点击次数。
    - 区分幂等状态设置和依赖活动对象的动作指令：关闭定位、开启蓝牙、设为静音等状态设置在当前状态已经符合要求时可以直接完成；停止播放、暂停下载、挂断电话、取消导航等动作必须存在正在运行的媒体、下载、通话或导航对象，活动对象不存在时不能按“初始状态已满足”处理。
    - 同时要求前置判断结果和条件成立后的执行动作时，包含两个可独立验收的结果，按复杂多任务处理。
    - 只评价从当前 query 首次发出或开始执行，到任务闭环、失败或录屏结束之间的行为；忽略此前历史内容和完成后的复制、滚动、返回或新任务，除非它改变或撤销目标状态。
  evidence_rules:
    - 必须同时检查按时间顺序的视觉证据和 agent 文本自述，把二者作为互补证据联合判断；不得只依据其中一路下结论。等待用户的明确指引可以出现在界面、弹窗、任务执行过程文字或 agent 最终回答中，不要求视觉和文本重复出现同一句指引；任一路出现明确指引且没有相反证据时，都必须纳入最后有效状态。
    - 证据是否充分取决于其展示的具体内容，而不是所在载体；卡片、按钮、设置页面、系统状态、任务执行过程和结果页面都可以用于判断。
    - 画面明确展示目标对象及其结果状态，并且与 query 一致、没有相反证据时，即可作为完成依据；例如设置结果卡片直接显示目标开关状态或当前值，无需再次进入完整设置页面。
    - 多条证据可以共同证明同一生效目标；具体执行动作或参数、完成状态、结果卡片和 agent 回复相互一致时，可以形成充分的完成证据链。复杂多任务的每个生效目标都必须有对应证据，一个目标的证据不能替代其他目标。
    - 缺少反证不等于存在完成证据；不得因其他目标执行成功、系统具备操作能力或 agent 声称无报错，就推定未展示结果的目标已经完成。
    - 只有泛化的“正在操作/已完成”、工具名称、目标入口、操作轨迹或 agent 文字自述，而没有反映所有生效目标的具体结果状态时，只能证明尝试；模型收到的画面没有可验证结果时判 nok，并标记未展示可验证结果，不得推测是否由抽帧遗漏造成。
    - 不要求展示状态变化前后对比；对于幂等状态设置，最终画面或初始状态直接满足 query 即可。对于依赖活动对象的动作指令，必须先有可操作对象；对象不存在属于缺少前置条件。关键帧未展示全部过渡过程不等于步骤错误，只根据实际观察到的走错、遗漏、重复、冗余或结果冲突扣分。
    - 任务执行窗口始终处于带“查看/点击查看”入口的缩略状态，导致过程和结果均不可见，且没有其他证据可供判断时，判 others，优先标记任务执行窗口未展开，相关评分维度填 null；窗口曾展开或其他画面已展示结果时，按正常证据判断。
    - 查询、导航、搜索、日程、天气、攻略、推荐、作文和摘要等结果以文字或卡片呈现时，可以作为最终结果；不主动进行外部事实核验，但必须检查是否完成 query 要求、是否遗漏必要内容，以及是否与录屏、结果卡、上下文或可信先验存在明确冲突。
    - 后续更直接的系统状态与卡片或回复冲突时，以更直接的状态为准；仍无法确定时判 others，并标记评测证据冲突。
    - 对未完成目标必须识别其最后有效状态。只有界面、任务执行过程文字或 agent 最终回答明确提示用户登录、授权、验证、补充信息、选择或确认时，才属于等待用户；普通登录入口、设置页、应用首页、加载状态、任务超时或终止本身都不是用户交互指引。没有明确指引、最终回答为空且流程停止或超时，属于静默停滞。登录、授权、协议同意和身份验证等需要用户本人确认或输入的界面，只要自身包含明确操作指引即可证明等待用户，不应要求 agent 代替用户点击同意或输入凭据。agent 在执行过程中完成了无错误的前置步骤并发起与任务闭环直接相关的明确询问时，按实际等待用户状态判断，不因前置步骤已经交付部分结果而提前判 ok，也不因裁判认为可以采用其他执行策略而否定该状态。目标已明确进入等待用户状态时，缺少用户后续操作和最终结果只是阻塞的必然后果，不能再为同一目标标记应执行目标未执行、执行中断或未展示可验证结果；后续因用户未响应而出现的超时、任务终止、返回桌面或返回助手界面，也不能覆盖此前已经出现的明确等待指引。
  correctness:
    ok: 简单任务唯一生效目标完成，或复杂多任务所有生效目标完成，无需用户继续操作；幂等状态设置的初始状态已经满足也属于完成。停止播放、暂停下载、挂断电话、取消导航等依赖活动对象的动作在对象不存在时不属于初始状态已满足。条件任务正确获得前置信息且正确执行实际分支，条件不成立时正确跳过后续目标也属于完成。内部过程信息泄露、回复语义重复、重复系统卡片及不影响结果的轻微过程问题只记录 issue_types，不直接改变 correctness。
    nok: 存在影响任务结果或闭环的可归责错误，包括已生效且具备执行条件的目标或必要动作未执行、任务结果与 query 不一致、无明确系统异常或用户交互却停止或卡住、三方应用跳转后中断、未展示可验证结果，或回复与可见界面冲突。回复内部矛盾只有在影响最终结果理解或内容交付时才判 nok。已观察到的结果性执行错误优先于后续的临时异常或能力不支持声明。
    no_support: 不存在影响任务结果的可归责执行错误，但因助手无法自主补齐的外部条件无法闭环。包括两类：一是界面、任务执行过程文字或 agent 最终回答明确提示用户登录、授权、身份验证、补充必要信息、选择或确认，任务正在等待用户接管；二是缺少完成任务所需的图片、文本内容、应用、目标对象、硬件、设备能力或活动会话，或 agent 明确说明助手、设备或系统不支持完成该类任务，且没有可信先验或可见证据反驳。agent 明确说明缺少完成任务所需的信息并指引用户提供时，属于缺少前置条件；不得仅因任务尚未完成而判 nok。登录、权限或其他阻塞页面只有在界面自身、任务执行过程文字或最终回答包含明确用户操作指引时才属于 no_support；普通登录入口、回答为空的静默停滞、任务超时或终止本身不属于 no_support。
    others: 不存在优先级更高的可归责执行错误，且因临时系统或评测输入异常无法完成或可靠判断，包括 agent 明确说明算力不足、系统繁忙、遇到临时问题或稍后重试，外部服务暂时异常，以及 query、视频、输入数据或界面呈现异常。不得把没有异常说明的普通执行停止归为 others。
  issue_types:
    内部过程信息泄露:
      allowed_correctness: [ok, nok, no_support, others]
      description: agent 回复暴露无必要的内部推理、检索过程、skill、工具名称或调用过程；例如“我先想想任务规划”“加载某技能”“没有匹配的技能”“调用某工具/接口”等面向内部执行的文字。该问题默认不直接改变 correctness，即使后续任务已经闭环也必须记录。
    回复语义重复:
      allowed_correctness: [ok, nok, no_support, others]
      description: agent 回复前后重复表达相同含义；该问题默认不直接改变 correctness。
    回复内容自相矛盾:
      allowed_correctness: [ok, nok, no_support, others]
      description: agent 回复内部出现相互冲突的描述；只有矛盾影响最终结果理解或内容交付时才判 nok。
    重复系统卡片:
      allowed_correctness: [ok, nok, no_support, others]
      description: 同一任务出现内容相同或高度重复的系统结果卡；只有重复执行产生错误结果或副作用时才影响 correctness。
    重复操作:
      allowed_correctness: [ok]
      description: 存在不影响最终结果的重复点击或重复执行。
    路径冗余:
      allowed_correctness: [ok]
      description: 操作路径存在绕路，但最终结果正确闭环。
    轻微无关步骤:
      allowed_correctness: [ok]
      description: 存在少量无关步骤，但不影响最终结果。
    其他轻微问题:
      allowed_correctness: [ok]
      description: 任务正确闭环，但存在其他不影响 correctness 的轻微问题。
    应执行目标未执行:
      allowed_correctness: [nok]
      description: Query 直接要求或条件成立后已经生效，且具备执行条件的任务目标或必要动作没有开始执行；包括停在本可继续完成的最后一步，不包括条件未触发、因明确前置条件缺失而无法执行，或界面、最终回答已经明确等待用户操作的目标。rationale 必须指出具体目标。
    任务结果错误:
      allowed_correctness: [nok]
      description: 已经执行或交付结果，但最终结果与 query、可见证据或已知条件不一致；不得因无法外部核验文字事实而使用该类型。
    执行中断:
      allowed_correctness: [nok]
      description: 没有明确的临时系统异常，界面和 agent 最终回答也没有用户操作指引，普通任务执行过程停止、卡住、静默超时或异常循环未结束。
    三方应用跳转中断:
      allowed_correctness: [nok]
      description: 跳转到第三方应用后未进入正确目标流程，或停在登录页、首页等中间状态且界面和 agent 最终回答均没有明确用户操作指引；能够使用该类型时，不再同时输出普通执行中断。登录、授权或确认界面存在明确指引时，按缺少前置条件判断。
    未展示可验证结果:
      allowed_correctness: [nok]
      description: 有证据表明对应目标已经尝试执行，或 agent 明确声称该目标已经完成，但模型收到的画面没有展示能够验证完成的具体结果状态；不得推测是否由抽帧遗漏造成。目标根本没有开始执行时应使用应执行目标未执行；目标已明确等待用户操作时，缺少最终结果是阻塞后果，不使用本类型。
    回复与界面不一致:
      allowed_correctness: [nok]
      description: agent 面向用户的自然语言回复对任务最终结果的描述与录屏中的可见界面状态明确冲突。系统任务窗口中的步骤文案、勾选标记、“√已完成”“超时，任务终止”等流程状态不属于 agent 回复，不能据此使用本类型；必须先指出发生冲突的具体自然语言回复，否则不得标记。
    其他执行问题:
      allowed_correctness: [nok]
      description: 已确认存在影响结果的可归责执行错误，但现有 nok 类型无法覆盖。
    待用户澄清:
      allowed_correctness: [nok, no_support]
      description: 为继续完成原始任务，界面、任务执行过程文字或 agent 最终回答已向用户发起明确询问并等待补充、选择或确认；即使前置查询、搜索、导航到目标页或内容准备等步骤已经正确完成，只要原始任务仍需用户答复后才能继续，仍属于待用户澄清。复杂任务整体因其他独立目标错误判 nok 时可作为次要问题。
    缺少前置条件:
      allowed_correctness: [nok, no_support]
      description: 缺少图片、待处理文本或内容、应用、登录、权限、身份验证、目标对象、硬件、设备能力或助手能力等无法自主补齐的条件；agent 明确说明缺少完成任务所需的信息并指引用户提供时也属于本类型。登录、授权和身份验证场景需要界面、任务执行过程文字或 agent 最终回答包含明确用户操作指引。也包括停止播放、暂停下载、挂断电话、取消导航等动作缺少正在运行的目标对象或会话，以及 agent 明确声明能力不支持且没有可信反证的情况。所谓可信反证只能来自配置先验或当前可见的同一目标成功证据，不能用泛化能力常识、相似能力或裁判设想的替代策略反驳。复杂任务整体因其他独立目标错误判 nok 时可作为次要问题。
    其他阻塞原因:
      allowed_correctness: [nok, no_support]
      description: 已确认不存在当前目标的可归责执行错误且受到客观条件阻塞，但不属于待用户澄清或缺少前置条件。
    环境或算力异常:
      allowed_correctness: [nok, others]
      description: agent 明确说明算力不足、系统繁忙、遇到临时问题或稍后重试；复杂任务整体因其他目标错误判 nok 时可作为次要问题。
    外部服务暂时异常:
      allowed_correctness: [nok, others]
      description: 外部服务临时不可用，重试后可能恢复；稳定的能力不支持应使用缺少前置条件。
    视频损坏:
      allowed_correctness: [others]
      description: 输入视频内容明确损坏，无法用于评测。
    录屏数据不完整:
      allowed_correctness: [others]
      description: 输入的录屏数据本身明确不完整；不得根据关键帧中没有某状态而推测抽帧遗漏。
    视频无法解析:
      allowed_correctness: [others]
      description: 输入视频无法被系统正常解析。
    任务意图不明确:
      allowed_correctness: [others]
      description: Query 无法确定具体任务意图。
    任务要求矛盾:
      allowed_correctness: [others]
      description: Query 内部要求互相矛盾，无法确定可执行目标。
    输入数据异常:
      allowed_correctness: [others]
      description: Query、上下文、媒体路径或其他评测输入存在异常。
    任务执行窗口未展开:
      allowed_correctness: [others]
      description: 任务执行窗口始终处于缩略状态，过程和结果均不可见，且没有其他证据可供判断。
    评测证据冲突:
      allowed_correctness: [others]
      description: 多项可见证据互相冲突，无法可靠判断最终状态。
    未预期场景:
      allowed_correctness: [others]
      description: 出现现有 correctness 和 issue type 未预期覆盖的评测场景。
    其他未归类情况:
      allowed_correctness: [others]
      description: 已确认应判 others，但现有类型无法覆盖。
  decision_order:
    - 在给出 correctness 前必须先完成“阻塞证据门控”，不可跳过：①逐帧扫描并逐字摘录面向用户的登录、授权、同意、验证、补充、选择、确认等清晰可辨文字，注明来自哪个画面；协议说明配合“取消/同意”等按钮也属于明确指引；②从完整 agent 文本中逐字摘录“无法/缺少/未提供/请提供/请选择/是否/要不要/请确认”等与继续任务直接相关的原文；③标明每条文字属于界面用户指引、任务面板流程状态还是 agent 自然语言回复；④检查阻塞发生前是否已经存在与用户未响应无关、并会独立导致任务失败的可归责错误。只有能够逐字引用的、直接要求或询问用户采取下一步的完整句子或协议提示才算明确指引；普通“登录”入口、“查看”按钮、“手动操作中”状态、接管或停止控件、加载动画、流程“已完成”和“超时”均不算。不得根据图标、模式名称、页面类型或预期交互推测并不存在的指引，也不得在未逐条处理已看见指引文字的情况下声称“没有引导”或“只是超时”。
    - 阻塞证据门控的映射是强约束：任一路证据存在明确用户操作指引，且阻塞前没有相互独立的可归责错误时，对应未完成目标必须归为等待用户或缺少前置条件；目标未完成、无最终结果、用户未操作、超时终止或返回其他界面都是阻塞后果，不能再改判 nok。两路证据都没有明确指引、agent 文本为空且流程停止、加载或超时时，才按静默停滞判 nok。
    - 先确定当前 query 的有效时间窗、任务形态、条件、目标依赖关系、实际生效目标及原始任务的完成边界。查询、搜索或展示候选结果只有在 query 本身要求查询、搜索、推荐或列举时才可作为完成；query 要求预订、下单、发送、发布等实际动作时，前置查询结果只是执行过程，agent 随后询问用户选择、补充或确认，说明原始任务尚在等待用户，不能提前判 ok。
    - 按时间顺序分别通读全部视觉证据和完整 agent 文本自述，再合并两路证据判断；不得因最终一帧返回桌面或助手界面而忽略此前出现的协议同意、授权、选择、确认或补充信息指引，也不得因文本为空而忽略界面中的明确指引。
    - 在检查回复冲突前，先区分 agent 面向用户的自然语言回复与任务执行面板的系统流程状态。任务面板中的步骤说明、勾选、“已完成”和“超时，任务终止”不能作为 agent 回复；同一面板明确要求用户确认或选择时，判定为等待用户，不能把步骤“已完成”与后续超时拼成回复矛盾。
    - 再判断指令属于幂等状态设置还是依赖活动对象的动作：状态设置当前已经符合要求可判完成；停止、暂停、继续、取消、挂断等动作没有对应活动对象，且 agent 正确说明情况时判 no_support，并标记缺少前置条件。
    - 对每个目标优先识别最直接根因：已完成、待用户澄清、缺少前置条件、临时环境异常、评测侧无法判断、应执行但未执行、执行中断或结果错误；同一个目标不要同时记录根因和其必然后果。
    - 对每个未完成目标确认最后有效状态。界面、任务执行过程文字或 agent 最终回答有明确的登录、授权、验证、补充、选择或确认指引时属于等待用户；没有任何用户操作指引、最终回答为空且流程停止或超时属于静默停滞。登录、授权、协议同意和身份验证界面的明确指引可以直接证明需要用户本人接管；agent 在执行过程中无错误地完成前置步骤后发起与任务闭环直接相关的明确询问时，按实际等待状态判断，不评价是否存在其他更优的免询问策略。超时或终止只是结果，不能单独证明等待用户，也不能覆盖此前的明确等待状态。已经明确等待用户的目标，不得再因用户未响应造成的未执行、中断或无最终结果改判为执行错误。
    - 复杂多任务中，用户阻塞只作用于确实依赖该次用户答复的目标及其依赖目标，不能自动豁免其他相互独立的目标。其他目标在阻塞前已经错误、声称完成但无证据，或本可独立执行却完全未执行时，整体仍判 nok；不得仅因任务采用串行执行，就假设某一登录或确认阻塞必然阻止后续所有独立目标。
    - 跳转第三方应用后停在登录页、首页或其他中间状态，且界面和 agent 最终回答都没有明确用户操作指引时，优先标记三方应用跳转中断；存在明确登录、授权或确认指引时按缺少前置条件判断。不得再为同一中断所阻塞的目标重复标记应执行目标未执行或未展示可验证结果。只有其他相互独立的目标存在不同根因时，才追加对应类型。
    - 严格区分“目标未执行”和“执行后缺少结果证据”：完全没有开始的独立目标使用应执行目标未执行；已经尝试或明确声称完成、但无状态证据时使用未展示可验证结果；同一目标不能同时使用两者。
    - 画面已经展示具体最终状态，但该状态与 query 要求不一致时，优先标记任务结果错误；只有没有展示可判断对错的具体结果状态时，才使用未展示可验证结果。两者不能用于同一目标。
    - 对“播放、开始播放、打开并播放”等动作，搜索结果卡、影视详情卡、播放按钮或流程“已完成”只能证明找到了内容或准备播放，不能证明播放动作已经发生；必须看到播放器界面、播放进度、暂停按钮、正在播放状态或其他同等直接证据。只有结果卡而没有播放状态时判 nok，并标记未展示可验证结果。
    - 任一目标存在影响结果的可归责错误时整体判 nok；Answer 后续声称临时异常或能力不支持不能覆盖已经观察到的执行错误。
    - 所有生效目标完成或正确跳过时判 ok；不存在可归责错误且所有未完成目标都被外部条件阻塞时判 no_support；其余因临时系统、评测输入或未预期问题无法完成或判断时判 others。
    - issue_types 第一项必须是决定整体 correctness 的主要原因；复杂任务可在后续项记录其他目标的不同根因，rationale 必须说明每项对应的目标。内部过程信息泄露、回复语义重复、回复内容自相矛盾和重复系统卡片等通用质量问题不能作为 nok、no_support、others 的第一项。
    - 确定 correctness 和主要根因后，必须再独立通读完整 agent 回复并检查四类通用质量问题：内部过程信息泄露、回复语义重复、回复内容自相矛盾、重复系统卡片；发现即追加到 issue_types，不得因 correctness 已确定而跳过。
  conditional_rules:
    - 只要求完成条件实际成立后所激活的目标；条件不成立时正确跳过后续动作，也属于完成。
    - 已获得前置信息但条件判断错误、条件成立却未执行后续动作，或条件不成立却错误执行后续动作，判 nok。
    - 因用户未提供必要信息而无法判断条件时判 no_support；因临时系统或外部服务异常无法获得条件信息时判 others；query 内部条件矛盾、无法确定生效分支时判 others。
  low_level_rules:
    - 只有意图清晰的简单任务被判 nok，且不存在客观阻塞并发生明显可归责的基础执行错误时，才输出 yes。
    - ok、no_support、others 以及复杂多任务固定输出 no；不要仅因结果是 nok 就自动输出 yes。
rubrics:
  - name: 操作完成度
    description: 基于整个 query 判断生效目标和最终文字回复是否完整闭环。
    weight: 0.7
    scale: 5
    criteria:
      - 所有生效目标是否完成且最终状态可验证
      - 是否仍需要用户继续操作
      - 条件任务是否判断并执行了正确分支
      - agent 自述是否与画面一致
      - 最终文字回复是否完成 query 要求、清晰传达结果且与画面一致
      - 幂等状态设置的初始状态是否已经满足用户要求；动作指令是否存在必要的活动对象
      - 是否存在助手无法自主补齐的客观阻塞
    score_anchors:
      5: 整个 query 的所有生效目标完整闭环，或幂等状态设置的初始状态已经满足；最终状态有充分证据支持；通用回复或展示质量问题不单独降低 correctness
      4: 所有生效目标已完成，但最终结果存在不影响闭环确认的轻微瑕疵
      3: 已完成主要结果，但仍有应执行目标未执行、任务结果错误、执行中断，或缺少能够验证结果的状态证据
      2: 只完成少量结果或中间过程，最终目标明显未闭环
      1: 未执行、最终状态错误、执行相反操作，或只有文字声明而没有任何实际完成证据
  - name: 步骤正确性
    description: 基于整个操作过程判断实际操作路径是否正确、连贯且合理。
    weight: 0.3
    scale: 5
    criteria:
      - 是否发生与 query 相关的实际操作
      - 操作路径是否正确且未缺失关键步骤
      - 是否出现走错、卡住、反复尝试、冗余或无关步骤
      - 合法替代路径、系统自动跳转和关键帧之间缺失的过渡画面不应被判为冗余
      - 只评价当前 query 发出后到任务闭环前的操作，忽略之前的历史内容和完成后的无关行为
    score_anchors:
      5: 当前任务有效时间窗内的实际路径正确、连贯，没有可观察到的冗余、无关或错误步骤
      4: 存在少量冗余、重复点击或无关步骤，但不影响最终结果，可以接受
      3: 存在明显绕路或多次重试，但整体方向正确
      2: 多次走错路径或操作混乱，只完成少量相关过程
      1: 路径完全错误、南辕北辙，或没有发生与 query 相关的实际操作
